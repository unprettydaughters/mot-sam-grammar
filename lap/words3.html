<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>동작 도감</title>
<style>
:root{--bg:#FBF5EA;--card:#FFFFFF;--ink:#3B2F2A;--sub:#7A6A60;--line:#EADFCF;--acc:#E26D5A;--acc-soft:#FBE3DE;--ok:#2F7D4B;--ok-soft:#DFF1E5;--wait:#9A6508;--wait-soft:#FBEBCB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1815;--card:#27211D;--ink:#F4EADF;--sub:#B9AA9B;--line:#3A312B;--acc:#F08A78;--acc-soft:#4A2E29;--ok:#7FCF9A;--ok-soft:#27402F;--wait:#E5B05A;--wait-soft:#463615;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C1815;--card:#27211D;--ink:#F4EADF;--sub:#B9AA9B;--line:#3A312B;--acc:#F08A78;--acc-soft:#4A2E29;--ok:#7FCF9A;--ok-soft:#27402F;--wait:#E5B05A;--wait-soft:#463615;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55}
main{max-width:560px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:14px;margin:18px 0 8px;color:var(--sub);font-weight:700}
h2:first-child{margin-top:0}
.sub{margin:0 0 14px;color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
.stagebox{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:#EAF3F8}
#stage{display:block;width:100%;height:100%}
.cap{padding:12px 4px 4px}
#les{font-size:12px;color:var(--sub)}
#core{font-size:13px;color:var(--sub);margin-top:2px}
#core b{color:var(--ink)}
#en{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-top:6px}
#en b{color:var(--acc)}
#ko{font-size:15px;color:var(--sub)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 4px 2px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px}
.btn:active{transform:scale(.97)}
.ctl label{font-size:13px;color:var(--sub);margin-left:auto;display:flex;gap:6px;align-items:center;min-height:40px}
#used{display:flex;flex-wrap:wrap;gap:6px;padding:8px 4px 2px;font-size:12px}
.pill{border-radius:999px;padding:3px 10px;border:1px solid transparent}
.pill.t{background:var(--wait-soft);color:var(--wait)}
.pill.r{background:var(--ok-soft);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;min-height:38px;display:flex;gap:6px;align-items:baseline;font-size:15px;font-weight:600}
.chip small{font-size:11px;color:var(--sub);font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.on small{color:#fff;opacity:.85}
details summary{cursor:pointer;font-weight:700;font-size:14px;min-height:36px;display:flex;align-items:center}
.pt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.pt td,.pt th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.pt th{color:var(--sub);font-weight:600;border-top:0}
.pt .u{color:var(--sub);font-size:12px}
.shead td{font-weight:700;color:var(--sub);background:transparent;padding-top:12px}
#err{white-space:pre-wrap;color:#b3261e;font-size:12px;margin:8px 0 0}
#testout{white-space:pre-wrap;font-size:12px}
html,body{background:transparent}main{padding-block:0 8px}h1,.sub,#used,#testout{display:none}.card:has(details){display:none}#cp,.card h2:nth-of-type(2){display:none}</style>
</head>
<body>
<main>
<h1>동작 도감</h1>
<p class="sub">못삼영 1~52과 낱말을 삼돌이 · 못난이가 몸으로 보여 준다. 동작 그림 42장과 소품 34개 · 배경이 들어갔다.</p>

<section class="card">
  <div class="stagebox">
    <svg id="stage" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="낱말 장면">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE8F5"/><stop offset="1" stop-color="#FFF3DC"/></linearGradient></defs>
      <g id="world">
        <rect x="-700" y="-400" width="1800" height="626" fill="url(#sky)"/>
        <path d="M-700 226 Q-560 150 -420 226 Z M-300 226 Q-130 120 40 226 Z M120 226 Q300 140 480 226 Z M560 226 Q700 160 860 226 Z" fill="#DCEBC8"/>
        <rect x="-700" y="226" width="1800" height="500" fill="#BFDDA4"/>
        <rect x="-700" y="226" width="1800" height="4" fill="#A9CC8C"/>
        <g id="lb"></g><g id="lsh"></g><g id="lm"></g><g id="lf"></g><g id="lx"></g>
      </g>
      <text id="lab" x="200" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#3B2F2A" opacity="0" font-family="system-ui,sans-serif"></text>
    </svg>
  </div>
  <div class="cap">
    <div id="les"></div>
    <div id="core"></div>
    <div id="en"></div>
    <div id="ko"></div>
  </div>
  <div class="ctl">
    <button class="btn" id="prev" aria-label="이전">←</button>
    <button class="btn" id="replay">처음부터</button>
    <button class="btn" id="next" aria-label="다음">→</button>
    <label><input type="checkbox" id="auto"> 이어서 보기</label>
  </div>
  <div id="used"></div>
</section>

<section class="card">
  <h2>동사</h2><div class="chips" id="cv"></div>
  <h2>전치사</h2><div class="chips" id="cp"></div>
</section>

<section class="card">
  <details><summary id="psum"></summary><div id="ptab"></div></details>
</section>
<pre id="err"></pre>
<div id="testout"></div>
</main>

SbwACV3959nIQ/3n2c7Wc/nzKRmGp0v8+ZSMxH/4IH//6SADjxXR9ZiXxkAAAKQMooY6rSHQqsrbWOVUzruHIKd9WP8Xg9OekV+KGbP8gAmev9FlJD+MRkpxEX/87CQAAAA","w":340,"h":193}},"bgy":0.7311,"poses":[{"key":"stand","ko":"서기","sheet":1,"desc":"두 발을 모으고 똑바로 서 있다. 두 팔은 몸 옆에 늘어뜨리고, 얼굴은 화면 오른쪽 앞을 보며 살짝 웃는다."},{"key":"walkA","ko":"걷기 1","sheet":1,"desc":"걷는 중. 관객에 가까운 쪽 다리가 앞으로 나가 뒤꿈치가 막 땅에 닿았고, 반대쪽 다리는 뒤에서 발끝으로 서 있다. 관객에 가까운 팔은 뒤로, 반대쪽 팔은 앞으로 가볍게 흔든다."},{"key":"walkB","ko":"걷기 2","sheet":1,"desc":"걷는 중. 두 다리가 몸 아래에서 엇갈려 지나가는 순간 — 한 발은 땅을 딛고 서 있고, 다른 발은 무릎을 살짝 굽혀 몸 밑을 지나 앞으로 나오는 중이다. 두 팔은 몸 옆에서 엇갈려 지나간다."},{"key":"jump","ko":"점프","sheet":1,"desc":"공중에 떠 있다. 두 발이 땅에서 한 뼘 넘게 떠 있고 무릎을 접어 올렸으며, 두 팔은 머리 위로 번쩍 들고 입을 크게 벌려 웃는다."},{"key":"land","ko":"착지","sheet":1,"desc":"막 착지한 직후. 두 발은 땅에 붙어 있고 무릎을 깊게 굽혀 몸을 낮췄다. 두 팔은 앞으로 벌려 균형을 잡고, 눈은 크게 뜨고 있다."},{"key":"push","ko":"밀기","sheet":1,"desc":"두 손바닥을 앞(화면 오른쪽)으로 어깨 높이에 곧게 뻗어 무언가를 힘껏 미는 순간. 몸통이 앞으로 크게 기울고, 뒷다리는 뒤로 쭉 펴 발끝으로 버티고 앞무릎은 굽혔다. 이를 앙다물고 얼굴은 앞을 본다. 두 손은 빈손으로 활짝 펴 있다."},{"key":"reach","ko":"집기","sheet":1,"desc":"한쪽 팔(관객에 가까운 팔)을 앞(화면 오른쪽)으로 눈높이까지 쭉 뻗어 손가락을 오므려 무언가를 집으려는 순간. 반대쪽 팔은 뒤로 뻗어 균형을 잡고, 몸은 앞으로 기울어 뒤꿈치가 살짝 들렸다. 시선은 손끝을 본다. 손은 비어 있다."},{"key":"climb","ko":"오르기","sheet":2,"desc":"두 팔을 머리 위로 곧게 뻗어 주먹을 쥐고(위의 무언가를 잡은 모양, 손은 비어 있다), 한쪽 무릎을 배 높이까지 들어 올렸다. 얼굴은 위를 올려다본다. 몸은 똑바로 서 있다."},{"key":"sit","ko":"앉기","sheet":2,"desc":"바닥에 앉아 있다. 엉덩이가 땅에 닿았고 두 다리를 앞(화면 오른쪽)으로 쭉 뻗었으며, 등은 곧게 세우고 두 손은 무릎 위에 얹었다. 얼굴은 앞을 보며 편안하게 웃는다."},{"key":"lean","ko":"기대기","sheet":2,"desc":"몸 전체가 뒤(화면 왼쪽)로 살짝 기울어 등과 뒤통수로 뒤에 있는 무언가에 기대어 있다. 팔짱을 끼고, 한 발을 다른 발 앞으로 교차해 힘을 뺀 편안한 모습. 시선은 앞을 본다."},{"key":"hide","ko":"숨기","sheet":2,"desc":"쪼그리고 앉아 몸을 최대한 작게 웅크렸다. 두 손으로 머리 위를 감싸고 고개를 숙인 채, 눈만 앞(화면 오른쪽)을 조심스레 살핀다."},{"key":"eat","ko":"먹기","sheet":2,"desc":"두 손을 입 바로 앞에 모아 작은 것을 쥔 모양으로 두고, 입을 크게 벌려 한 입 베어 무는 순간. 볼이 볼록하고 눈은 행복하게 반쯤 감겼다."},{"key":"wave","ko":"손 흔들기","sheet":2,"desc":"관객에 가까운 팔을 어깨 위로 높이 들어 손바닥을 펴 흔들며 활짝 웃는다. 반대쪽 팔은 몸 옆에 내렸다."},{"key":"point","ko":"가리키기","sheet":2,"desc":"한쪽 팔을 앞(화면 오른쪽)으로 어깨 높이에 곧게 뻗어 검지 하나로 멀리 가리킨다. 시선도 같은 방향. 반대쪽 손은 허리에 얹었다."},{"key":"surprise","ko":"놀람","sheet":3,"desc":"뒤(화면 왼쪽)로 휘청한 모습. 상체가 뒤로 젖혀지고 한 발은 뒤로 밀려 뒤꿈치가 떠 있다. 두 팔을 양옆으로 펼쳐 균형을 잡고, 눈을 크게 뜨고 입을 동그랗게 벌렸다."},{"key":"cheer","ko":"환호","sheet":3,"desc":"두 팔을 V자로 번쩍 들고 한 발로만 땅을 딛은 채 다른 쪽 다리를 뒤로 접어 올려 환호하며 활짝 웃는다. 땅을 딛은 발은 바닥에 붙어 있다. 몸은 살짝 뒤로 젖혔다."},{"key":"sleep","ko":"자기","sheet":3,"desc":"옆으로 누워 잔다. 화면에서 가로로 길게 누웠고 머리는 화면 왼쪽, 발은 오른쪽. 눈을 감고 두 손을 볼 아래에 모았으며 무릎을 살짝 굽혔다. 입가에 편안한 미소."},{"key":"sing","ko":"노래","sheet":3,"desc":"한 손을 가슴 위에 얹고 고개를 살짝 들어 눈을 감은 채 입을 크게 벌려 노래한다. 다른 팔은 옆으로 부드럽게 펼쳤다."},{"key":"cry","ko":"울기","sheet":3,"desc":"두 주먹으로 두 눈을 비비며 서서 입을 크게 벌려 운다. 어깨가 들썩이고 볼에 굵은 눈물 방울이 흐른다."},{"key":"write","ko":"쓰기","sheet":3,"desc":"상체를 앞(화면 오른쪽)으로 조금 숙이고, 한 손을 앞으로 뻗어 엄지와 검지로 가늘고 긴 것을 쥐는 모양을 한 채 무언가를 쓰는 손동작. 시선은 손끝을 본다. 다른 손은 몸 옆에 내렸다."},{"key":"carry","ko":"안기","sheet":3,"desc":"두 팔을 가슴 앞에서 크게 둥글게 모아 공만 한 크기의 무언가를 안은 모양. 안은 것에 무게가 있는 듯 상체가 살짝 뒤로 젖혔고, 시선은 정면. 팔 안은 비어 있다."}],"sheets":{"1":"이동 · 힘","2":"자세 · 몸짓","3":"마음 · 생활"},"imgs":{"sam_front":{"u":"data:image/webp;base64,UklGRpglAABXRUJQVlA4WAoAAAAQAAAAggAA5gAAQUxQSD0KAAABsIb/v+I01jmZ6dApITglZIBttmyzQn2Nurt33Z123d3d3d39urv7LQ5FArSTZi4hJNjmWXpm/ucFJcA5/9nnvoyICSDyerSsImNmqTE6UOjTPZS4LJ3iLVt93c86I+YRwz+8d0uweJqHugidkr9wz3+jiW8dOLKT6o8d+M8FM/JUj1soeSc9Hu5jADxtcA7HO16dZ3g91AU8+jGPhAdt4BMIzlC0sfroPJUiR/UZZzYN2HzCwe7reHVesYaaUrCtPmbzSQVn6MAPFmUraFH9mEe7beCT7nzTdt0MjeKk5G2rH7C5kHb8j2tyFIwU/y2dNhcVvm3be1wmPkrZvabNBbb76rd5KTJq+Ts9NhcaWMu2bIqKEng05nDRWdv52agU3Bu1ufis43QvIt4dnYzLyJpP1tCYtq6FcTlZzXEKEtpJjYxLCokb8nCgJS8OcmntjvU6Ct5rD4E8nNVVKAgoFS2My5y8NxeB3Hv7udROePVU6TKWhx25eOqHASqZMquOcckhslqTzHtWL8jGU58XUqnU2U2MSw9dIUWq/McHOIKDj+TIpC7ocDBw2kKKRFk3JAAD6L1Al4cGmxlH8fBf/FSazOo44AAHQoostLyJcSRiO3VZtGUWIMGH3y6ikhQ80M+xhK5TNDm0dWEHj9guXQpa9OIQx3PoxVwqg7a6ExCBtqAU3usSqPSe6ZWAlvx8hGPKGoKKeOpCE1CBSEgC71UJZKwqTTha+L0Ux6X3LF04paITcOH9D/uE05Za2Ni1JVS0rFuSHFk4YIhGi38xgo4pntEJ6EQqFOFMhEKiKaEIPtYKTTB9Ywyf2BZdtNN7vwOcgVDv7u8A1mpNsMyL4whViebd const LOW=['sit','hide','sleep','land'],UPR=['stand','walkA','walkB','wave','point','sing','eat','carry','write','cry','lean','reach','push','surprise'];
function viaOf(from,to){

    if(T.tok!==TOKEN){tw.splice(i,1);T.rej(CANCEL);continue}
    T.t+=dt;const p=T.ms<=0?1:Math.min(1,T.t/T.ms),e=EASE[T.e](p);
    for(const k in T.to)T.obj[k]=T.from[k]+(T.to[k]-T.from[k])*e;
    if(p>=1){tw.splice(i,1);T.res()}
  }
  for(const b of BIND)if(!b.off)b.f(now,dt);
  for(const a of ACT)drawActor(a,now,dt);
  for(const s of SPR)drawSprite(s);
  sortMids();
  world.setAttribute('transform',`translate(200 150) scale(${CAM.z}) translate(${-CAM.x} ${-CAM.y})`);
  labEl.setAttribute('opacity',LAB.op);
  if(usedDirty){usedDirty=false;renderUsed()}
  if(!TICK)requestAnimationFrame(frame);
}

function clearScene(){
  ACT.splice(0).forEach(a=>{a.g.remove();a.sh.remove()});SPR.splice(0).forEach(s=>s.g.remove());
  BIND.length=0;MIDS.length=0;USED.clear();Object.assign(CAM,CAM0);LAB.op=0;labEl.textContent='';usedDirty=true;
}

function mkS(){
  const S={
    a:(who,x,y,k,f)=>newActor(who,x,y,k||'@stand',f||1),
    sam:(x,k,f)=>newActor('sam',x,Y,k||'@stand',f||1),
    mot:(x,k,f)=>newActor('mot',x,Y+2,k||'@stand',f||1),
    p:spr,rm,t:wait,to:tween,
    pose:(a,k,pop=true)=>poseTo(a,pk(k),pop),
    bind:f=>{const b={f};BIND.push(b);return b},
    hold(sp,a,dx,dy,ms=300){
      if(sp.hb)sp.hb.off=true;
      const h={dx:(sp.x-a.x)*a.flip,dy:a.y-a.hop-a.bob-sp.y};
      const b={f:()=>{sp.x=a.x+h.dx*a.flip;sp.y=a.y-a.hop-a.bob-h.dy;sp.rot=a.rot*a.flip}};
      BIND.push(b);sp.hb=b;tween(h,{dx,dy},ms,'io');return b;
    },
    cam:(z,x,y,ms)=>{if(!ms){Object.assign(CAM,{z,x,y});return Promise.resolve()}return tween(CAM,{z,x,y},ms,'io')},
    lab:txt=>{labEl.textContent=txt;LAB.op=0;return tween(LAB,{op:1},200,'out')},
    night(op,ms){if(!S.dk||!SPR.includes(S.dk)){S.dk=spr('dark',0,0,{z:'f',op:0})}return tween(S.dk,{op},ms,'io')},
    arrow(x1,x2,y,o={}){const r=spr('rule',x1,y,{z:'b'});r.sx=(x2-x1)/100;const out={r};
      if(o.head!==false)out.h=spr('ahead',x2,y,{z:'b'});if(o.tail)out.t=spr('adot',x1,y,{z:'b'});return out},
    async walk(a,tx,ty,ms){
      if(ty===undefined)ty=a.y;if(tx!==a.x)a.flip=tx>a.x?1:-1;
      a.seq++;a.w0=performance.now();a.walking=true;tween(a,{rot:2},ms*.15,'out');
      await tween(a,{x:tx,y:ty},ms,'io');
      a.walking=false;applyPose(a,'walkB');tween(a,{rot:0},120,'out');await wait(80);applyPose(a,'stand',true);
    },
    async hop(a,h,ms,dx=0,pz=true){
      a.seq++;if(pz)applyPose(a,'land');
      await tween(a,{sx:1.06,sy:.92},ms*.16,'out');
      if(pz)applyPose(a,'jump');
      if(dx)tween(a,{x:a.x+dx},ms*.68,'lin');
      tween(a,{sx:.92,sy:1.1},ms*.12,'out');
      await tween(a,{hop:h},ms*.34,'out');
      await tween(a,{hop:0},ms*.34,'in');
      if(pz)applyPose(a,'land');
      await tween(a,{sx:1.06,sy:.92},ms*.05,'out');
      await tween(a,{sx:1,sy:1},ms*.15,'back');
      if(pz)applyPose(a,'stand',true);
    },
    fx(kind,x,y,o={}){
      const ms=o.ms||900;
      if(kind==='splash'){
        for(let i=0;i<7;i++){
          const d=spr('drop',x,y,{z:'x'}),ang=-Math.PI*(.15+.7*i/6);
          tween(d,{x:x+Math.cos(ang)*(16+i%3*6),y:y+Math.sin(ang)*(28+i%2*10)},420,'out')
            .then(()=>tween(d,{y:y+8,op:0},280,'in')).then(()=>rm(d)).catch(()=>{});
        }
        return;
      }
      const s=spr('g_'+kind,x,y,{z:'x',s:o.s||1,op:0});
      tween(s,{x:x+(o.dx||0),y:y+(o.dy===undefined?-26:o.dy),op:1},ms*.25,'out')
        .then(()=>tween(s,{op:0},ms*.75,'lin')).then(()=>rm(s)).catch(()=>{});
    }
  };
  return S;
}

/* ---------- 장면 ---------- */
/* 장면 42개. 한 장면 = //#이름 줄 + 객체 하나. 쓰는 동작 그림은 '@이름'으로 적는다 — 만들기.py가 이 글자를 세어 「쓰는 낱말」 표와 프롬프트를 만든다.
   좌표: 400×300 무대, 땅은 y=244(Y). 그림은 모두 오른쪽을 본 옆모습, 왼쪽으로 가면 flip. */
const SC={

//#eat
eat:{w:'eat',g:'v',l:3,en:'I *eat* gimbap',ko:'나는 먹는다 김밥을',run:async S=>{
 const {t,to,walk,pose,fx,cam,p,sam}=S;const a=sam(110);
 p('plate',250,Y+6,{s:1.15});
 const R=[-16,-8,0,8,16].map(d=>p('roll',250+d*1.15,Y+1,{s:1.15,zy:Y+9}));
 cam(1.4,205,185,900);await t(300);await walk(a,205,Y,900);
 for(const r of R.slice(0,3)){
  pose(a,'@reach');await to(a,{rot:6},200,'out');
  await to(r,{x:a.x+18,y:Y-46,s:.9},380,'io');
  pose(a,'@eat');await to(r,{s:.1,op:0},170,'in');
  await to(a,{sy:.94},110);await to(a,{sy:1},130,'back');
  fx('star',a.x+10,Y-62,{dy:-14,ms:600});await to(a,{rot:0},160);
 }
 pose(a,'@stand');await t(600);
}},

//#have
have:{w:'have',g:'v',l:3,en:'I *have* a book',ko:'나는 갖고 있다 책을',run:async S=>{
 const {t,to,walk,pose,fx,hold,bind,p,sam}=S;const a=sam(70);
 p('table',250,Y,{s:.9});const k=p('book',250,Y-31,{s:1.3,zy:Y+1});
 await t(400);await walk(a,205,Y,1200);pose(a,'@reach');await to(a,{rot:8},250,'out');
 pose(a,'@carry');hold(k,a,14,36,420);await to(a,{rot:0},300,'back');
 const r=p('ring',a.x,a.y-30,{z:'b',op:0});bind(()=>{r.x=a.x;r.y=a.y-30});
 await to(r,{op:1},500);fx('heart',a.x+12,Y-72,{ms:900});await t(1500);
}},

//#take
take:{w:'take',g:'v',l:3,en:'I *take* a book',ko:'나는 집는다 책을',run:async S=>{
 const {t,to,walk,pose,hold,p,sam}=S;const a=sam(60);
 p('table',230,Y,{s:.9});const k=p('book',230,Y-31,{s:1.3,zy:Y+1});
 await t(400);await walk(a,170,Y,1100);
 pose(a,'@reach');await to(a,{rot:9},260,'out');await t(160);
 pose(a,'@carry');hold(k,a,14,36,380);await to(a,{rot:0},220,'back');
 await t(300);await walk(a,340,Y,1400);await t(300);
}},

//#END
};

const IDS=Object.keys(SC);

/* ---------- 화면 ---------- */
const poseKo=k=>{const p=D.poses.find(x=>x.key===k);return p?p.ko:(k==='run'?'달리기':k)};
function renderUsed(){
  const box=$('#used');box.innerHTML='';
  USED.forEach((temp,k)=>{const s=document.createElement('span');s.className='pill '+(temp?'t':'r');s.textContent=poseKo(k)+(temp?' · 임시 그림':' · 진짜 그림');box.appendChild(s)});
  if(!USED.size)box.textContent='';
}
function hl(s){return s.replace(/\*(.+?)\*/g,'<b>$1</b>')}
function setUI(id){
  const s=SC[id];
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id));
  $('#les').textContent=s.l+'과 · '+(D.lessons[s.l]||'');
  $('#core').innerHTML=(D.core[s.l]&&s.g==='p')?hl(D.core[s.l].replace(/\*\*(.+?)\*\*/g,'*$1*')):'';
  $('#en').innerHTML=hl(s.en);$('#ko').textContent=s.ko;
  try{history.replaceState(null,'','#'+id+(TICK?'!t':''))}catch(e){}
}
function fail(e,id){$('#err').textContent+='['+id+'] '+(e&&e.stack?e.stack:e)+'\n'}
async function play(id){
  const my=++TOKEN;CUR=id;clearScene();setUI(id);const S=mkS();
  try{
    for(;;){
      clearScene();await SC[id].run(S);if(my!==TOKEN)return;
      if($('#auto').checked){go(1);return}
      await S.t(1000);if(my!==TOKEN)return;
    }
  }catch(e){if(e!==CANCEL)fail(e,id)}
}
function go(d){const i=(IDS.indexOf(CUR)+d+IDS.length)%IDS.length;play(IDS[i])}

function build(){
  for(const id of IDS){
    const s=SC[id],b=document.createElement('button');b.className='chip';b.dataset.id=id;
    b.innerHTML=`<span>${s.w}</span><small>${s.l}</small>`;b.onclick=()=>play(id);
    (s.g==='v'?$('#cv'):$('#cp')).appendChild(b);
  }
  $('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);$('#replay').onclick=()=>play(CUR);
  const use={};for(const id of IDS)for(const k of D.use[id]||[])(use[k]=use[k]||[]).push(SC[id].w);
  const real=k=>['sam','mot'].filter(w=>D.real[w]&&D.real[w][k]).length;
  const n=D.poses.filter(p=>real(p.key)===2).length;
  $('#psum').textContent=`뽑을 동작 그림 ${D.poses.length}개 × 2명 · 진짜 ${n} · 임시 ${D.poses.length-n}`;
  let h='<table class="pt"><tr><th>그림</th><th>상태</th><th>쓰는 낱말</th></tr>',sh=0;
  for(const p of D.poses){
    if(p.sheet!==sh){sh=p.sheet;h+=`<tr class="shead"><td colspan="3">${sh}장 · ${D.sheets[sh]}</td></tr>`}
    const r=real(p.key);
    h+=`<tr><td>${p.ko}</td><td>${r===2?'<span class="pill r">있음</span>':r===1?'<span class="pill t">한 명만</span>':'<span class="pill t">대기</span>'}</td><td class="u">${(use[p.key]||[]).join(' · ')}</td></tr>`;
  }
  $('#ptab').innerHTML=h+'</table>';
}

/* 검사: #test 로 열면 장면 전부를 빠르게 한 번씩 돌려 오류를 센다 */
async function runTest(){
  TS=25;const out=$('#testout'),errs=[];
  for(const id of IDS){
    const my=++TOKEN;clearScene();CUR=id;const S=mkS();
    out.textContent='running '+id;
    try{await SC[id].run(S)}catch(e){if(e!==CANCEL)errs.push(id+': '+(e&&e.message?e.message:e))}
  }
  out.textContent='TEST '+IDS.length+' scenes, errors='+errs.length+'\n'+errs.join('\n');
  document.title='TEST-DONE-'+errs.length;
}
window.addEventListener('error',e=>fail(e.message,'window'));
window.addEventListener('unhandledrejection',e=>{if(e.reason!==CANCEL)fail(e.reason,'promise')});

build();
if(TICK)setInterval(()=>frame(performance.now()),16);else requestAnimationFrame(frame);
if(TESTMODE)runTest();
else{const h=location.hash.slice(1).split('!')[0];play(SC[h]?h:IDS[0])}
</script>
