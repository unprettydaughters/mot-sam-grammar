<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 기차 엔진(11/14) — 과마다 같은 부분: 소리 · 움직임 도구 · 기차 · 낱말 태우기 · 출발 판정 흐름.
   과마다 다른 것은 카드(기차/N과.js)가 맡는다: 낱말 · 그림 · 몇 칸 차면 떠나나 · 맞는 꼴 · 틀린 까닭 · 장면.
   카드가 정하는 이름: WORDS · POSE · ORDER · NOUNS · TOTAL · SEEN_KEY · CARD. 만들기.py가 아래 두 번째 script 자리에 끼운다.
   1과 게임(못삼영-기차게임)은 아직 따로 돈다. 움직임은 전부 코드(WAAPI) */
:root{
  --bg:#FAFAF8; --card:#FFFFFF; --block:#F5F3EF; --line:#E8E4DC; --line2:#D8D2C6;
  --text:#4A4039; --title:#2C2420; --sub:#6E645A; --dim:#9C9288;
  --lav-bg:#F2EFF9; --lav:#7C6BAE; --lav-deep:#54487A;
  --amber-bg:#FDF8E7; --amber:#E8C547; --amber-text:#9A6E1E;
  --red:#C04040; --dark:#2C2420;
  --font:"Pretendard","Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --sh1:0 1px 3px rgba(100,80,60,.05); --sh2:0 2px 12px rgba(100,80,60,.06);
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;font-weight:500;letter-spacing:-.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;user-select:none;-webkit-user-select:none}
.app{max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--lav);outline-offset:2px}

.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.head h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--title);text-wrap:balance}
.head h1 b{color:var(--lav-deep);font-weight:600}
.pills{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.seen,.snd span{font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--sub);font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:999px;background:var(--block);white-space:nowrap}
.seen.new{background:var(--amber-bg);color:var(--amber-text)}
.snd{min-height:44px;display:flex;align-items:center}

.stage{position:relative;height:clamp(170px,30dvh,300px)}
.scene{position:absolute;inset:-40px -200px 0;overflow:hidden;pointer-events:none}
.scene svg{position:absolute;left:0;bottom:0;width:100%;height:70%}
.cloud{position:absolute;left:0;opacity:.9}
.floor{position:absolute;left:-200px;right:-200px;bottom:16px;height:2px;background:var(--line)}
.actor{position:absolute;bottom:18px;left:0;will-change:transform;z-index:2}
.lift,.in{display:block}
.in{transform-origin:50% 100%}
.idle{display:flex;align-items:flex-end;justify-content:center;height:100%;transform-origin:50% 100%}
.idle img,.idle svg{display:block;height:100%;width:auto;max-width:none}
.fx{position:absolute;left:0;top:0;pointer-events:none;z-index:4}
.dust{width:12px;height:12px;border-radius:50%;background:var(--line2)}

.say{min-height:50px;text-align:center}
.say .en{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--title)}
.say .ko{font-size:14px;font-weight:400;color:var(--sub);margin-top:2px}

.train{position:relative;display:flex;align-items:flex-end;padding-top:22px}
.car{position:relative;z-index:1;min-height:44px;transform-origin:50% 100%}
.car img{display:block;width:100%}
.car.s{width:32.3%} .car.v{width:26.6%} .car.o{width:27%}
.link{width:16.3%;margin:0 -4.6% 3.5%;z-index:0}
.tag{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);min-width:58%;padding:5px 8px;border-radius:999px;
  background:var(--card);box-shadow:var(--sh1);font-size:14px;font-weight:600;color:var(--title);text-align:center;white-space:nowrap}
.car.s .tag{left:56%}
.tag.empty{background:rgba(255,255,255,.35);box-shadow:none;border:1.5px dashed rgba(44,36,32,.4);color:transparent}
.car.opt .tag.empty{border-style:dotted;border-color:rgba(44,36,32,.25)}
.glow{position:absolute;left:50%;top:7%;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);opacity:0;
  box-shadow:0 0 22px 14px rgba(232,197,71,.8)}
.car.v.on .glow{opacity:1}
.smoke{position:absolute;left:5.5%;top:0;width:9%;opacity:0;pointer-events:none}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{min-height:50px;border-radius:14px;background:var(--card);box-shadow:var(--sh2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px}
.tile .en{font-size:16px;font-weight:600;color:var(--title);text-align:center;line-height:1.2}
.tile .ko{font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--dim)}
.tile.used{background:var(--block);box-shadow:none}
.tile.used .en{color:var(--dim)}
.fly{position:fixed;left:0;top:0;z-index:9;padding:5px 12px;border-radius:999px;background:var(--card);box-shadow:0 6px 28px rgba(100,80,60,.10);
  font-size:14px;font-weight:600;color:var(--title);pointer-events:none;white-space:nowrap}

.go-btn{min-height:52px;border-radius:16px;background:var(--dark);color:#FAFAF8;font-size:16px;font-weight:600}
.go-btn:disabled{background:var(--block);color:var(--dim);cursor:default}
</style>

<div class="app">
  <div class="head">
    <h1 id="h1"></h1>
    <div class="pills">
      <button class="snd" id="snd" aria-pressed="true"><span>소리 켬</span></button>
      <div class="seen" id="seen">0 / 0</div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="scene" id="scene">

const $=id=>document.getElementById(id);
const stage=$("stage"), train=$("train"), tilesEl=$("tiles"), goBtn=$("go");
const cars=[...document.querySelectorAll(".car")];
let slots=[null,null,null], busy=false, token=0, touched=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SPRING="cubic-bezier(.3,1.5,.5,1)";

/* ── 소리: 파일 없이 그 자리에서 만든다 ── */
let AC=null, soundOn=true, noiseBuf=null;
try{soundOn=localStorage.getItem("gicha-snd")!=="0"}catch(e){}
function ac(){ if(!soundOn)return null;
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null}
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(AC.state==="suspended")AC.resume(); return AC;}
function tone(f,dur,o={}){const c=ac();if(!c)return;const t=c.currentTime+(o.at||0),os=c.createOscillator(),g=c.createGain();
  os.type=o.type||"triangle";os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.vol||.12,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  os.connect(g).connect(c.destination);os.start(t);os.stop(t+dur+.02);}
function noise(dur,o={}){const c=ac();if(!c)return;const t=c.currentTime+(o.at||0),s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();
  s.buffer=noiseBuf;f.type="bandpass";f.frequency.value=o.f||900;f.Q.value=.8;
  g.gain.setValueAtTime(o.vol||.12,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f).connect(g).connect(c.destination);s.start(t);s.stop(t+dur+.02);}
const SFX={
  pick(){tone(620,.07,{to:900,vol:.1})},
  land(){tone(300,.09,{to:170,vol:.16});noise(.05,{f:1400,vol:.06})},
  off(){tone(500,.08,{to:300,vol:.08})},
  boing(){tone(280,.16,{to:620,type:"sine",vol:.1})},
  step(){noise(.035,{f:500,vol:.05})},
  whistle(){[0,.22].forEach((at,i)=>{const d=i?.42:.16;tone(1040,d,{at,type:"sine",vol:.07});tone(1320,d,{at,type:"sine",vol:.05});})},
  chug(){for(let i=0;i<6;i++)noise(.09,{at:.1+i*.17,f:700,vol:.1})},
  jingle(){[660,880,990,1320].forEach((f,i)=>tone(f,.16,{at:i*.09,vol:.09}))},
  fail(){tone(190,.14,{to:150,type:"sawtooth",vol:.05});tone(150,.2,{at:.15,to:110,type:"sawtooth",vol:.05})}
};
function drawSnd(){$("snd").firstElementChild.textContent=soundOn?"소리 켬":"소리 끔";$("snd").setAttribute("aria-pressed",soundOn);}
$("snd").onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("gicha-snd",soundOn?"1":"0")}catch(e){}drawSnd();if(soundOn)SFX.pick();};

/* ── 움직임 도구 (1과 기차 게임과 같다) ── */
function tw(el,to,ms,ease){const from=getComputedStyle(el).transform;el.style.transform=to;
  if(ms)el.animate([{transform:from},{transform:to||"none"}],{duration:ms,easing:ease||SPRING});return sleep(ms||0);}
function kf(el,frames,ms,o={}){const an=el.animate(frames,Object.assign({duration:ms,easing:"ease-out"},o));
  const p=sleep(ms+(o.delay>0?o.delay:0));an.done=p;an.then_=f=>p.then(f);return an;}
const pos={}, timers=new Set();
const W=()=>stage.clientWidth, A=k=>$(WORDS[k].el), part=(k,c)=>A(k).querySelector("."+c);
const clampX=x=>Math.max(W()*.06,Math.min(W()*.94,x));
function place(k,x,ms=0,ease){pos[k]=x;const el=A(k);return tw(el,`translateX(${x-el.offsetWidth/2}px)`,ms,ease||"linear");}
function inner(k,t,ms=260,ease){return tw(part(k,"in"),t,ms,ease);}
function setPose(k,name){const P=POSE[k];if(!P)return;const p=P[name]||P.stand,img=A(k).querySelector("img");
  if(img.getAttribute("src")!==p[0])img.src=p[0];img.style.height=(p[1]*100)+"%";}
function face(k,dir){const el=A(k).querySelector("img,svg");el.style.transform=dir<0?"scaleX(-1)":"";}
function jump(k,h=22,ms=340){return kf(part(k,"lift"),[{transform:"translateY(0)"},{transform:`translateY(${-h}px)`,offset:.45},{transform:"translateY(0)"}],ms,{easing:"ease-in-out"}).done;}
function fxAt(x,yUp,cls,html){const d=document.createElement("div");d.className="fx "+(cls||"");if(html)d.innerHTML=html;
  d.style.transform=`translate(${x}px,${stage.clientHeight-18-yUp}px)`;stage.appendChild(d);return d;}
function dust(x){const d=fxAt(x-6,10,"dust");const b=d.style.transform;
  kf(d,[{transform:b+" scale(.4)",opacity:.9},{transform:b+` translate(${(Math.random()-.5)*20}px,-12px) scale(1.5)`,opacity:0}],380).then_(()=>d.remove());}
const STAR='<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#E8C547" d="M12 2l2.9 6.6 7.1.7-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>';
const NOTE='<svg width="20" height="20" viewBox="0 0 24 24"><path fill="#7C6BAE" d="M9 3v10.6A4 4 0 1 0 11 17V7h6V3z"/></svg>';
function burst(x,yUp,n=7){for(let i=0;i<n;i++){const d=fxAt(x-9,yUp,"",STAR),b=d.style.transform,a=Math.PI*2*i/n+Math.random()*.5,r=34+Math.random()*26;
  kf(d,[{transform:b+" scale(.3)",opacity:1},{transform:b+` translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(1) rotate(${(Math.random()-.5)*200}deg)`,opacity:0}],520).then_(()=>d.remove());}}
function note(k){const d=fxAt(pos[k]-10,A(k).offsetHeight*.85,"",NOTE),b=d.style.transform,dx=(Math.random()-.3)*40;
  kf(d,[{transform:b+" scale(.5)",opacity:1},{transform:b+` translate(${dx}px,-46px) scale(1.1) rotate(${dx/2}deg)`,opacity:0}],900).then_(()=>d.remove());}

/* 달려가기: 그림 두 장을 번갈아 바꾸고, 발밑에 먼지 */
async function run(k,x,speed=.42){
  x=clampX(x);const d=x-pos[k];if(Math.abs(d)<4)return;const ms=Math.max(220,Math.abs(d)/speed);
  face(k,Math.sign(d));let i=0;const P=POSE[k],gap=Math.max(90,(P?150:210)*.42/speed);
  const step=()=>{if(P){const r=P.run[i%2];const img=A(k).querySelector("img");img.src=r[0];img.style.height=(r[1]*100)+"%";}
    jump(k,P?7:16,gap);SFX.step();dust(pos[k]);i++;};
  step();const iv=setInterval(step,gap);timers.add(iv);
  const from=pos[k];const t0=performance.now();const tr=setInterval(()=>{pos[k]=from+d*Math.min(1,(performance.now()-t0)/ms)},50);timers.add(tr);
  const el=A(k);await tw(el,`translateX(${x-el.offsetWidth/2}px)`,ms,"linear");
  clearInterval(iv);clearInterval(tr);timers.delete(iv);timers.delete(tr);pos[k]=x;setPose(k,"stand");
}
const cap=s=>s[0].toUpperCase()+s.slice(1);
</script>
<script>
/* 3과 카드: 세 칸(누가 → 한다 → 무엇을)이 다 차야 출발한다. 틀은 그대로, 낱말만 갈아 끼운다.

  chomp(){noise(.07,{f:2400,vol:.1});tone(170,.06,{type:"square",vol:.04})},
  clank(){tone(900,.05,{type:"square",vol:.06});tone(1350,.14,{at:.03,type:"sine",vol:.06})},

/* ── 물건 · 말풍선 · 하트 ── */
const ppos={};
const isP=o=>!!PROPS[o], pe=o=>$("p-"+o), pin=o=>pe(o).querySelector(".pi"), hOf=k=>A(k).offsetHeight;
function pAt(o,x,ms=0,ease){ppos[o]=x;const el=pe(o);return tw(el,`translateX(${x-el.offsetWidth/2}px)`,ms,ease||"linear");}
function pIn(o,t,ms=260,ease){return tw(pin(o),t,ms,ease);}
function near(a,x,gap){const d=x>=pos[a]?1:-1;return{d,x:x-d*gap};}
function pill(x,yUp,text,ms=1300){const d=fxAt(0,yUp,"pill");d.textContent=text;const w=d.offsetWidth;
  const b=`translate(${Math.max(2,Math.min(W()-w-2,x-w/2))}px,${stage.clientHeight-18-yUp}px)`;d.style.transform=b;
  kf(d,[{transform:b+" scale(.5)",opacity:0},{transform:b+" scale(1.08)",opacity:1,offset:.12},{transform:b,opacity:1,offset:.22},{transform:b,opacity:1,offset:.85},{transform:b+" translateY(-8px)",opacity:0}],ms).then_(()=>d.remove());}
const HEART='<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#E07A8F" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>';
function hearts(x,yUp,n=6){for(let i=0;i<n;i++){const d=fxAt(x-9,yUp,"",HEART),b=d.style.transform,dx=(Math.random()-.5)*56;
  kf(d,[{transform:b+" scale(.4)",opacity:0},{transform:b+" scale(1)",opacity:1,offset:.2},{transform:b+` translate(${dx}px,-64px) scale(1.1)`,opacity:0}],1000,{delay:i*130,fill:"backwards"}).then_(()=>d.remove());}}
function crumbs(x,yUp){for(let i=0;i<4;i++){const d=fxAt(x-3,yUp,"crumb"),b=d.style.transform;
  kf(d,[{transform:b,opacity:1},{transform:b+` translate(${(Math.random()-.5)*34}px,${yUp*.85}px)`,opacity:0}],520,{easing:"ease-in"}).then_(()=>d.remove());}}
function sweat(a){const d=fxAt(pos[a]+(Math.random()-.5)*20,hOf(a)*.95,"drop"),b=d.style.transform;
  kf(d,[{transform:b,opacity:1},{transform:b+" translateY(26px)",opacity:0}],520,{easing:"ease-in"}).then_(()=>d.remove());}
async function dropIn(o,x){pAt(o,x);pIn(o,"",0);pe(o).style.opacity=1;
  await kf(pin(o),[{transform:"translateY(-150px)"},{transform:"translateY(0)",offset:.55,easing:"ease-out"},{transform:"translateY(-14px)",offset:.75,easing:"ease-in"},{transform:"translateY(0)"}],560,{easing:"ease-in"}).done;
  SFX.land();dust(x);}
/* 들고 가기: 사람은 발을 바꾸지 않고 콩콩, 무거우면 느리고 땀이 난다 */
async function carryTo(a,o,x,speed,heavy){
  x=clampX(x);const dist=x-pos[a];if(Math.abs(dist)<4)return;
  const ms=Math.max(260,Math.abs(dist)/speed),dir=Math.sign(dist),off=dir*(isP(o)?12:18);face(a,dir);
  if(isP(o))await pAt(o,pos[a]+off,150,"ease-out");else{face(o,dir);await Promise.all([place(o,pos[a]+off,150,"ease-out"),inner(o,`rotate(${dir*78}deg)`,150)]);}
  const hop=setInterval(()=>{jump(a,heavy?3:6,heavy?300:200);SFX.step();dust(pos[a]);if(heavy)sweat(a);},heavy?320:210);timers.add(hop);
  const wob=heavy?kf(part(a,"in"),[{transform:"rotate(-4deg)"},{transform:"rotate(4deg)"},{transform:"rotate(-4deg)"}],700,{iterations:Infinity,easing:"ease-in-out"}):null;
  const el=A(a),tg=isP(o)?pe(o):A(o);
  if(isP(o))ppos[o]=x+off;else pos[o]=x+off;
  await Promise.all([tw(el,`translateX(${x-el.offsetWidth/2}px)`,ms,"linear"),tw(tg,`translateX(${x+off-tg.offsetWidth/2}px)`,ms,"linear")]);
  clearInterval(hop);timers.delete(hop);if(wob)wob.cancel();pos[a]=x;
}

/* ── 동작 셋 × 셋째 칸 넷 ── */
async function doEat(a,o,my){
  if(isP(o)){
    const {d,x}=near(a,ppos[o],30);await run(a,x,.5);if(my!==token)return;face(a,d);
    const h=hOf(a),mouth=h*.72,mx=pos[a]+d*14;
    setPose(a,"reach");await Promise.all([pAt(o,mx,260,"ease-out"),pIn(o,`translateY(${-mouth}px) scale(.8)`,260,"ease-out")]);if(my!==token)return;
    setPose(a,"eat");
    if(o==="gimbap"){
      for(const s of [.55,.3,0]){SFX.chomp();crumbs(mx,mouth);
        await Promise.all([pIn(o,`translateY(${-mouth}px) scale(${s})`,170,"ease-in"),inner(a,"scale(1.04,.94)",120)]);await inner(a,"",130);if(my!==token)return;}
      pe(o).style.opacity=0;setPose(a,"cheer");burst(pos[a],h*.8,8);pill(pos[a],h+8,"냠냠!");await jump(a,18,360);
    }else if(o==="ball"){
      SFX.clank();await inner(a,"scale(1.04,.94)",110);if(my!==token)return;
      setPose(a,"surprise");pill(pos[a]-d*20,h+8,"딱딱해!");SFX.boing();
      const far=clampX(mx+d*130);
      await Promise.all([pAt(o,far,600,"linear"),(async()=>{await pIn(o,`translateY(${-mouth-50}px)`,240,"ease-out");await pIn(o,"",360,"ease-in");})()]);
      if(my!==token)return;SFX.land();dust(far);await pIn(o,"translateY(-12px)",120,"ease-out");await pIn(o,"",160,"ease-in");
      for(let i=0;i<3;i++){face(a,i%2?d:-d);await sleep(150);}face(a,d);setPose(a,"stand");
    }else{
      SFX.chomp();await inner(a,"scale(1.04,.94)",110);if(my!==token)return;
      setPose(a,"surprise");SFX.grunt();pill(pos[a]-d*20,h+8,"퉤퉤!");
      await pIn(o,"",380,"ease-in");SFX.land();dust(ppos[o]);
      for(let i=0;i<4;i++)await inner(a,`rotate(${i%2?6:-6}deg)`,110,"ease-in-out");await inner(a,"",120);setPose(a,"stand");
    }
  }else{ /* 친구를 먹으려 한다 → 친구가 뛰어넘어 도망 */
    const {d,x}=near(a,pos[o],70);await run(a,x,.5);if(my!==token)return;face(a,d);
    setPose(a,"eat");SFX.chomp();await inner(a,"scale(1.05,.93)",120);inner(a,"",140);
    face(o,-d);setPose(o,"surprise");SFX.yikes();pill(pos[o],hOf(o)+8,"으악!");await jump(o,20,300);if(my!==token)return;
    A(o).style.zIndex=4;const land=clampX(pos[a]-d*80);
    await Promise.all([place(o,land,620,"linear"),(async()=>{await tw(part(o,"lift"),"translateY(-90px)",310,"ease-out");await tw(part(o,"lift"),"",310,"ease-in");})()]);
    if(my!==token)return;SFX.land();dust(land);face(a,-d);setPose(a,"surprise");
    await run(o,d>0?W()*.06:W()*.94,.75);
  }
}
async function doTake(a,o,my){
  const edge=WORDS[a].home<.5?W()*.06:W()*.94;
  if(isP(o)){
    const {d,x}=near(a,ppos[o],26);await run(a,x,.5);if(my!==token)return;face(a,d);
    const h=hOf(a),heavy=o==="bag";
    setPose(a,"reach");await sleep(160);setPose(a,"carry");
    if(heavy){SFX.grunt();pill(pos[a],h+8,"무거워…");
      await Promise.all([pAt(o,pos[a]+d*12,300,"ease-out"),pIn(o,`translateY(${-h*.3}px)`,520,"ease-out"),inner(a,"scale(1.05,.92)",300)]);}
    else{SFX.pop();await Promise.all([pAt(o,pos[a]+d*12,220,"ease-out"),pIn(o,`translateY(${-h*.42}px)`,220,"ease-out")]);}
    if(my!==token)return;
    await carryTo(a,o,edge,heavy?.16:.45,heavy);if(my!==token)return;
    await pIn(o,"",240,"ease-in");SFX.land();dust(ppos[o]);if(heavy)await inner(a,"",200);
    setPose(a,"cheer");burst(pos[a],h*.8,6);await jump(a,14,320);
  }else{ /* 친구를 번쩍 들어서 데려간다 */
    const {d,x}=near(a,pos[o],40);await run(a,x,.5);if(my!==token)return;face(a,d);
    const h=hOf(a);A(o).style.zIndex=4;
    setPose(o,"surprise");SFX.yikes();pill(pos[o],hOf(o)+8,"어어?");
    setPose(a,"carry");await Promise.all([place(o,pos[a]+d*18,260,"ease-out"),tw(part(o,"lift"),`translateY(${-h*.38}px)`,260,"ease-out"),inner(o,`rotate(${d*78}deg)`,300)]);
    if(my!==token)return;
    await carryTo(a,o,edge,.3,false);if(my!==token)return;
    await Promise.all([tw(part(o,"lift"),"",260,"ease-in"),inner(o,"",260)]);SFX.land();dust(pos[o]);
    setPose(a,"cheer");await jump(a,14,320);
  }
}
async function doHave(a,o,my){
  const h=hOf(a),d=WORDS[a].home<.5?1:-1;face(a,d);
  if(isP(o)){ /* 손에 퐁 나타난다 */
    setPose(a,"carry");pAt(o,pos[a]+d*12);pIn(o,`translateY(${-h*.42}px) scale(0)`,0);pe(o).style.opacity=1;
    SFX.pop();await pIn(o,`translateY(${-h*.42}px) scale(1)`,320);if(my!==token)return;
    if(o==="bag"){SFX.grunt();pill(pos[a]-d*30,h+8,"무거워…");await inner(a,"scale(1.06,.9)",360,"ease-out");await sleep(450);await inner(a,"",300);}
    else{setPose(a,"cheer");await pIn(o,`translateY(${-h*1.02}px)`,300);if(my!==token)return;
      burst(pos[a]+d*12,h*1.1,7);pill(pos[a]-d*44,h*.7,"내 거야!");await jump(a,14,320);await jump(a,14,320);}
  }else{ /* 친구 곁으로 가서 같이 콩콩 */
    const {d:dd,x}=near(a,pos[o],48);await run(a,x,.5);if(my!==token)return;face(a,dd);face(o,-dd);
    setPose(a,"cheer");setPose(o,"cheer");SFX.heart();const mid=(pos[a]+pos[o])/2,top=Math.max(h,hOf(o));
    hearts(mid,top*.9);pill(mid,top+10,"내 친구야!");
    for(let i=0;i<2;i++)await Promise.all([jump(a,16,360),jump(o,16,360)]);
  }
}

const CARD={
  title:"못삼영 3과 기차 놀이",
  h1:"<b>세 칸 틀</b>에 낱말만 갈아 끼운다",
  need:3, optional3:false, cols:4, size:{sam:100,mot:120},
  carLabels:["첫째 칸, 누가","둘째 칸, 한다","셋째 칸, 무엇을"],
  allSeen:"스물네 장면을 다 봤다",
  css:`.prop{position:absolute;left:0;bottom:18px;z-index:3;opacity:0;will-change:transform}
.pi{transform-origin:50% 100%}.prop img{display:block;width:auto;max-width:none}
.fx.pill{padding:4px 10px;border-radius:999px;background:var(--card);box-shadow:var(--sh2);font-size:14px;font-weight:600;color:var(--title);white-space:nowrap}
.crumb{width:5px;height:5px;border-radius:2px;background:#C9A16B}
.drop{width:6px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#9EC3E6}
.kc{display:inline-block}.kc.v{color:var(--lav-deep);font-weight:600}.kl{font-size:12px;color:var(--dim);margin-right:6px}`,
  stage:Object.entries(PROPS).map(([k,p])=>`<div class="prop" id="p-${k}"><div class="pi"><img alt="" src="${p.src}" style="height:${p.h}px"></div></div>`).join(""),
  ok:ty=>ty==="nvo"||ty==="nvn",
  /* 틀린 자리: 어느 칸이 왜 틀렸는지 한 줄. 우리말 순서면 그 낱말로 옮긴 꼴을 보여 준다 */
  why(ty,r){
    if(ty[2]==="v"&&ty[0]!=="v"&&ty[1]!=="v"&&ty.slice(0,2).includes("n")){
      const s=WORDS[r[0]].t==="n"?r[0]:r[1],o=s===r[0]?r[1]:r[0];
      return `우리말 순서야. 동작을 둘째 칸으로: ${WORDS[s].ga} ${WORDS[r[2]].ko} ${WORDS[o].eul}`;}
    if(ty[0]==="v")return "맨 앞 칸엔 누가가 타야 해. 동작은 그 바로 뒤";
    if(ty[0]==="o")return `${WORDS[r[0]].eun} 아무것도 못 해. 맨 앞 칸엔 삼돌이나 못난이를 태워`;
    if(ty[1]!=="v")return "둘째 칸에 동작이 없어서 불이 안 켜졌어";
    return "셋째 칸엔 김밥 · 공 · 가방 같은 무엇을이 타야 해";
  },
  async act([a,v,o],my){
    A(a).style.zIndex=3;
    if(isP(o)&&v!=="have"){await dropIn(o,W()*.5);if(my!==token)return;await sleep(150);}
    await (v==="eat"?doEat:v==="take"?doTake:doHave)(a,o,my);
  },
  ko:()=>"",
  after([a,v,o],my){
    const S=WORDS[a].ga,V=WORDS[v].ko,O=WORDS[o].eul;
    $("ko").innerHTML='<span id="kr"></span>';
    const put=(lab,arr)=>{$("kr").innerHTML=`<span class="kl">${lab}</span>`+arr.map(([k,t])=>`<span class="kc ${k}" data-k="${k}">${t}</span>`).join(" ");};
    put("우리말",[["s",S],["o",O],["v",V]]);
    (async()=>{await sleep(1100);if(my!==token||!$("kr"))return;
      const r0={};$("kr").querySelectorAll(".kc").forEach(e=>r0[e.dataset.k]=e.getBoundingClientRect().left);
      put("영어 순서",[["s",S],["v",V],["o",O]]);SFX.pick();
      $("kr").querySelectorAll(".kc").forEach(e=>{const dx=r0[e.dataset.k]-e.getBoundingClientRect().left;if(Math.abs(dx)<1)return;
        e.animate([{transform:`translate(${dx}px,0)`},{transform:`translate(${dx/2}px,${e.dataset.k==="v"?-12:6}px)`,offset:.5},{transform:"none"}],{duration:560,easing:"ease-in-out"});});
    })();
  },
  reset(){Object.keys(PROPS).forEach(o=>{const el=pe(o);[el,pin(o)].forEach(e=>{e.getAnimations().forEach(x=>x.cancel());e.style.transform="";});el.style.opacity=0;});},
  async home(my){const on=Object.keys(PROPS).filter(o=>+pe(o).style.opacity);if(!on.length)return;
    on.forEach(o=>{kf(pe(o),[{opacity:1},{opacity:0}],320);pe(o).style.opacity=0;});await sleep(320);}
};

</script>
<script>
/* ── 카드 읽기 ── */
let seen=new Set();
try{seen=new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||"[]"))}catch(e){}
const H=Object.assign({none:"아래 낱말을 눌러 기차에 태워 봐",some:"빈칸에 더 태워 봐",full:"다 탔다. 출발을 눌러 봐"},CARD.hints);
document.title=CARD.title;$("h1").innerHTML=CARD.h1;
if(CARD.css)document.head.insertAdjacentHTML("beforeend","<style>"+CARD.css+"</style>");
if(CARD.stage)stage.insertAdjacentHTML("beforeend",CARD.stage);
cars.forEach((c,i)=>c.setAttribute("aria-label",CARD.carLabels[i]));
if(CARD.optional3)cars[2].classList.add("opt");
tilesEl.style.gridTemplateColumns=`repeat(${CARD.cols||4},1fr)`;
NOUNS.forEach(k=>part(k,"in").style.height=CARD.size[k]+"px");
const ready=()=>slots.slice(0,CARD.need).every(Boolean);

function resetStage(){
  token++;timers.forEach(clearInterval);timers.clear();
  stage.querySelectorAll(".fx").forEach(h=>h.remove());
  if(CARD.reset)CARD.reset();
  NOUNS.forEach(k=>{const el=A(k);el.querySelectorAll(".lift,.in").forEach(e=>e.getAnimations().forEach(a=>a.cancel()));el.getAnimations().forEach(a=>a.cancel());
    place(k,W()*WORDS[k].home);inner(k,"",0);part(k,"lift").style.transform="";setPose(k,"stand");face(k,1);el.style.zIndex="";});
}
async function goHome(my){
  await sleep(1300); if(my!==token)return;
  if(CARD.home)await CARD.home(my);
  await Promise.all(NOUNS.map(async k=>{const home=W()*WORDS[k].home;setPose(k,"stand");await inner(k,"",200);if(my!==token)return;await run(k,home);if(my!==token)return;face(k,1);A(k).style.zIndex="";}));
}

/* ── 낱말 · 기차 ── */
ORDER.forEach(k=>{
  const b=document.createElement("button");b.className="tile";b.id="t-"+k;b.dataset.k=k;
  b.innerHTML=`<span class="en">${WORDS[k].en}</span><span class="ko">${WORDS[k].ko}</span>`;
  b.onclick=()=>{ if(busy)return; touched=true; const at=slots.indexOf(k);
    if(at>=0){unload(at);return;}
    const i=slots.indexOf(null); if(i<0){kf(b,[0,-5,5,-3,0].map(x=>({transform:`translateX(${x}px)`})),260);SFX.off();return;}
    load(k,i,b); };
  tilesEl.appendChild(b);
});
cars.forEach(c=>c.onclick=()=>{ if(busy)return; const i=+c.dataset.i; if(slots[i])unload(i); });

function load(k,i,tile){
  slots[i]=k; before(); SFX.pick();
  kf(tile,[{transform:"scale(.9)"},{transform:"scale(1)"}],200,{easing:SPRING});
  if(NOUNS.includes(k)){SFX.boing();jump(k,20,300);}
  const tag=cars[i].querySelector(".tag"),r0=tile.getBoundingClientRect(),r1=tag.getBoundingClientRect();
  const f=document.createElement("div");f.className="fly";f.textContent=WORDS[k].en;document.body.appendChild(f);
  const w=f.offsetWidth,h=f.offsetHeight,x0=r0.left+r0.width/2-w/2,y0=r0.top+r0.height/2-h/2,x1=r1.left+r1.width/2-w/2,y1=r1.top+r1.height/2-h/2;
  drawTiles();
  kf(f,[{transform:`translate(${x0}px,${y0}px) scale(1.1)`},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-70}px) scale(1.25) rotate(${(x1-x0)/14}deg)`,offset:.5},{transform:`translate(${x1}px,${y1}px) scale(1)`}],380,{easing:"ease-in-out"})
   .then_(()=>{f.remove();draw();SFX.land();
     kf(cars[i],[{transform:"scale(1.1,.86)"},{transform:"scale(.96,1.07)",offset:.5},{transform:"none"}],260);
     const tg=cars[i].querySelector(".tag");kf(tg,[{transform:"translate(-50%,-50%) scale(1.35)"},{transform:"translate(-50%,-50%) scale(1)"}],240,{easing:SPRING});});
}
function unload(i){slots[i]=null;before();SFX.off();draw();
  kf(cars[i],[{transform:"scale(.95,1.06)"},{transform:"none"}],200);}
function before(){resetStage();lamp(false);$("en").innerHTML="&nbsp;";
  const n=slots.filter(Boolean).length;
  $("ko").textContent=n===3?H.full:ready()?(H.ready||H.full):n?H.some:H.none;}
function drawTiles(){document.querySelectorAll(".tile").forEach(t=>t.classList.toggle("used",slots.includes(t.dataset.k)));}
function drawTags(){cars.forEach((c,i)=>{const tag=c.querySelector(".tag"),k=slots[i];tag.textContent=k?WORDS[k].en:"·";tag.classList.toggle("empty",!k);});}
let pulse=null;
function clearSlots(){slots=[null,null,null];goBtn.disabled=true;if(pulse){pulse.cancel();pulse=null;}}
function freeTiles(){[...tilesEl.querySelectorAll(".tile.used")].forEach((t,i)=>{t.classList.remove("used");
  kf(t,[{transform:"scale(.8)"},{transform:"scale(1.06)",offset:.6},{transform:"scale(1)"}],300,{delay:i*80,fill:"backwards"});});
  SFX.pick();}
async function flyBack(i,k){
  const tag=cars[i].querySelector(".tag"),tile=$("t-"+k),r0=tag.getBoundingClientRect(),r1=tile.getBoundingClientRect();
  const f=document.createElement("div");f.className="fly";f.textContent=WORDS[k].en;document.body.appendChild(f);
  const w=f.offsetWidth,h=f.offsetHeight,x0=r0.left+r0.width/2-w/2,y0=r0.top+r0.height/2-h/2,x1=r1.left+r1.width/2-w/2,y1=r1.top+r1.height/2-h/2;
  tag.textContent="·";tag.classList.add("empty");SFX.off();
  kf(cars[i],[{transform:"scale(.95,1.06)"},{transform:"none"}],200);
  await kf(f,[{transform:`translate(${x0}px,${y0}px) scale(1)`},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-50}px) scale(1.2) rotate(${(x1-x0)/14}deg)`,offset:.5},{transform:`translate(${x1}px,${y1}px) scale(.9)`}],360,{easing:"ease-in-out"}).done;
  f.remove();tile.classList.remove("used");SFX.pick();
  kf(tile,[{transform:"scale(.85)"},{transform:"scale(1)"}],240,{easing:SPRING});
}
function draw(){
  drawTags();drawTiles();
  const r=ready();goBtn.disabled=!r;
  if(r&&!pulse)pulse=kf(goBtn,[{transform:"scale(1)"},{transform:"scale(1.035)"},{transform:"scale(1)"}],900,{iterations:Infinity,easing:"ease-in-out"});
  if(!r&&pulse){pulse.cancel();pulse=null;}
  $("seen").textContent=`${seen.size} / ${TOTAL}`;
}
function lamp(on){cars[1].classList.toggle("on",on);$("vimg").src=on?V_ON:V_OFF;}
function puff(big){train.querySelectorAll(".smoke").forEach((sm,i)=>kf(sm,[{opacity:0,transform:"translate(0,14px) scale(.5)"},{opacity:1,offset:.25},{opacity:0,transform:`translate(${big?60:-22}px,${big?-46:-20}px) scale(${big?1.9:1.1})`}],big?900:1300,{delay:i*(big?170:9999)}));}
async function trainGo(){SFX.whistle();SFX.chug();puff(true);
  await kf(train,[{transform:"translateX(0)"},{transform:"translateX(10px)",offset:.25},{transform:"translateX(-125%)"}],620,{easing:"ease-in"}).done;
  drawTags();lamp(false);puff(true);
  await kf(train,[{transform:"translateX(125%)"},{transform:"translateX(-8px)",offset:.85},{transform:"translateX(0)"}],640,{easing:"ease-out"}).done;}

goBtn.onclick=async()=>{
  if(busy||!ready())return;
  busy=true;resetStage();lamp(false);const my=token;
  const rode=[...slots], ty=rode.map(k=>k?WORDS[k].t:"").join(""), key=rode.map(k=>k||"").join("-");
  clearSlots();
  $("en").textContent=cap(WORDS[rode[0]].en)+" "+rode.slice(1).filter(Boolean).map(k=>WORDS[k].en).join(" ")+".";
  kf($("en"),[{transform:"scale(.8)",opacity:0},{transform:"scale(1)",opacity:1}],260,{easing:SPRING});
  if(CARD.ok(ty)){
    lamp(true);$("ko").textContent="칙칙폭폭";
    trainGo();await sleep(380);
    await CARD.act(rode,my);if(my!==token){busy=false;return}
    $("ko").textContent=CARD.ko(rode);
    if(CARD.after)CARD.after(rode,my);
    if(!seen.has(key)){seen.add(key);try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seen]))}catch(e){}
      SFX.jingle();const s=$("seen");s.classList.add("new");setTimeout(()=>s.classList.remove("new"),1600);
      kf(s,[{transform:"scale(1)"},{transform:"scale(1.5)"},{transform:"scale(1)"}],420,{easing:SPRING});burst(W()/2,stage.clientHeight*.7,10);
      if(seen.size===TOTAL)$("ko").append(" · "+CARD.allSeen);}
    freeTiles();draw();busy=false;goHome(my);
  }else{
    SFX.fail();kf(train,[0,-7,7,-6,6,-3,0].map(x=>({transform:`translateX(${x}px)`})),460,{easing:"linear"});
    kf(cars[1],[{transform:"rotate(0)"},{transform:"rotate(-4deg)"},{transform:"rotate(4deg)"},{transform:"rotate(0)"}],420);
    $("ko").textContent=CARD.why(ty,rode);
    await sleep(760);
    await Promise.all(rode.map((k,i)=>k?sleep(i*110).then(()=>flyBack(i,k)):null));
    draw();busy=false;
  }
};

/* ── 가만히 있을 때도 살아 있게 ── */
function ambient(){
  NOUNS.forEach((k,i)=>kf(part(k,"idle"),[{transform:"scale(1,1)"},{transform:"scale(1.025,.965)"},{transform:"scale(1,1)"}],1500+i*230,{iterations:Infinity,easing:"ease-in-out",delay:i*300}));
  document.querySelectorAll(".cloud").forEach((c,i)=>{const w=$("scene").clientWidth;
    kf(c,[{transform:`translateX(${w+60}px)`},{transform:"translateX(-80px)"}],(46+i*17)*1000,{iterations:Infinity,easing:"linear",delay:-i*19000});});
  cars.forEach((c,i)=>kf(c.querySelector("img"),[{transform:"translateY(0)"},{transform:"translateY(-1.5px)"},{transform:"translateY(0)"}],420,{iterations:Infinity,delay:i*140,easing:"ease-in-out"}));
  setInterval(()=>{if(!busy)puff(false)},2600);
  setInterval(()=>{if(busy||document.hidden)return;const k=NOUNS[Math.floor(Math.random()*NOUNS.length)];jump(k,10,260);},1900);
  setInterval(()=>{if(touched||busy)return;[...tilesEl.children].forEach((t,i)=>kf(t,[{transform:"translateY(0)"},{transform:"translateY(-7px)"},{transform:"translateY(0)"}],320,{delay:i*70,easing:"ease-in-out"}));},3200);
}
function boot(){drawSnd();resetStage();draw();ambient();}
window.addEventListener("resize",()=>{if(!busy)resetStage()});
if(document.readyState==="complete")boot();else window.addEventListener("load",boot);
</script>
