/* 짜임: 폰 한 줄. 화면 넷(홈 · 과 · 리포트 · 지도), 과는 웹툰 → 낱말 → 게임 → 문제가 위 띠 하나로 이어진다. 과마다 같은 바퀴.
   기록은 이 폰에만(localStorage). 창고(Supabase)는 아이들이 다음 과를 누르는지 본 뒤에 붙인다 */
:root{
  --bg:#FAFAF8; --card:#FFFFFF; --block:#F5F3EF; --line:#E8E4DC; --line2:#D8D2C6;
  --text:#4A4039; --title:#2C2420; --sub:#6E645A; --dim:#9C9288;
  --lav-bg:#F2EFF9; --lav-face:#C8BAEA; --lav:#7C6BAE; --lav-deep:#54487A;
  --amber-bg:#FDF8E7; --amber:#E8C547; --amber-text:#9A6E1E;
  --red-bg:#FEF3F3; --red:#E87070; --red-text:#A02828;
  --btn:#2C2420; --btn-ink:#FAFAF8;
  --sh1:0 1px 3px rgba(100,80,60,.05); --sh2:0 2px 12px rgba(100,80,60,.06); --sh3:0 6px 28px rgba(100,80,60,.10);
  --font:"Pretendard","Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  /* 말풍선(웹툰 보기에서 그대로 가져옴) — 어두운 바탕에서도 말풍선은 흰 종이 그대로 */
  --b-fill:#FFFFFF; --b-ink:#2C2420; --cap-fill:#2C2420; --cap-ink:#FAFAF8; --paper:#FFFDF6; --msg:#F5F3EF;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1E1A17; --card:#2A2420; --block:#332C27; --line:#3A332D; --line2:#4A423B;
  --text:#DDD5CB; --title:#F3EEE7; --sub:#A99F93; --dim:#8A8076;
  --lav-bg:#2E2940; --lav-face:#4A4068; --lav:#B3A6DE; --lav-deep:#CFC4F0;
  --amber-bg:#3A3120; --amber:#E8C547; --amber-text:#E8C547;
  --red-bg:#3D2424; --red:#E87070; --red-text:#F0A0A0;
  --btn:#F3EEE7; --btn-ink:#1E1A17; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1E1A17; --card:#2A2420; --block:#332C27; --line:#3A332D; --line2:#4A423B;
  --text:#DDD5CB; --title:#F3EEE7; --sub:#A99F93; --dim:#8A8076;
  --lav-bg:#2E2940; --lav-face:#4A4068; --lav:#B3A6DE; --lav-deep:#CFC4F0;
  --amber-bg:#3A3120; --amber:#E8C547; --amber-text:#E8C547;
  --red-bg:#3D2424; --red:#E87070; --red-text:#F0A0A0;
  --btn:#F3EEE7; --btn-ink:#1E1A17; color-scheme:dark }

body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;font-weight:500;letter-spacing:-.01em;line-height:1.5;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
.label{font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--sub)}
.t32{font-size:32px;font-weight:700;letter-spacing:-.025em;color:var(--title);text-wrap:balance;line-height:1.2}
.t20{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--title);text-wrap:balance;line-height:1.35}
.t14{font-size:14px;font-weight:400;color:var(--sub)}
.num{font-variant-numeric:tabular-nums}

/* 버튼: 화면당 진한 것 하나, 나머지는 글자만 */
.go{min-height:52px;border-radius:16px;background:var(--btn);color:var(--btn-ink);font-size:16px;font-weight:600;width:100%}
.go:disabled{background:var(--block);color:var(--dim);cursor:default}
.txt{min-height:44px;font-size:14px;font-weight:600;color:var(--lav);padding:0 4px}
.txt.back{color:var(--sub);padding-left:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* 위 띠: 홈 · 웹툰 · 낱말 · 게임 · 문제 · 설명(옆문) */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding-block:8px;margin-bottom:4px}
.bar .home{min-height:44px;padding:0 6px 0 0;font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap}
.steps{display:flex;gap:4px;flex:1;min-width:0}
.step{min-height:44px;flex:1;border-radius:999px;font-size:14px;font-weight:600;color:var(--sub);background:var(--block)}
.step.done{background:var(--amber-bg);color:var(--amber-text)}
.step.now{background:var(--lav-bg);color:var(--lav-deep)}
.side{flex:none;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--dim)}
.side a{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;color:var(--lav-deep);white-space:nowrap}
.badge{font-size:12px;font-weight:500;letter-spacing:.02em;padding:4px 8px;border-radius:999px;background:var(--block);color:var(--dim);white-space:nowrap}

/* 홈 */
.head{display:flex;align-items:center;gap:12px;padding-top:24px}
.head .words{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.head img{flex:none;width:150px;height:auto}
.today{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:24px;background:var(--card);box-shadow:var(--sh2)}
.flow{display:flex;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--sub)}
.flow b{font-weight:600;color:var(--text)}
.note{font-size:14px;color:var(--sub);padding:12px 14px;border-radius:14px;background:var(--block)}

/* 웹툰 · 낱말 */
.wt-top{display:flex;flex-direction:column;gap:4px;padding-top:8px}
.wt{display:flex;flex-direction:column;gap:16px}
.jang{display:flex;flex-direction:column;gap:8px}
.jang h2{font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--sub);padding-top:8px}

/* 게임 · 낱말: 따로 도는 페이지를 틀에 담는다 */
.frame{display:block;border:0;width:calc(100% + 32px);max-width:none;margin-inline:-16px;height:max(640px,calc(100dvh - 140px));background:#FAFAF8}
.frame.words{height:640px;background:transparent}

/* 문제 */
.qhead{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.ctx{align-self:flex-start;font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--lav-deep);background:var(--lav-bg);padding:4px 10px;border-radius:999px}
.en{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--title);padding:14px 16px;border-radius:16px;background:var(--block);white-space:pre-line}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;border-radius:18px;background:var(--block);border:2px solid transparent}
.slots.ok{background:var(--amber-bg);border-color:var(--amber)}
.slots.no{background:var(--red-bg);border-color:var(--red)}
.slot{min-height:52px;border-radius:14px;border:1.5px dashed var(--line2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--title);padding:4px 6px;text-align:center}
.slot.full{border:0;background:var(--card);box-shadow:var(--sh1)}
.slot.bad{box-shadow:0 0 0 2px var(--red)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{min-height:52px;border-radius:14px;background:var(--card);box-shadow:var(--sh2);font-size:16px;font-weight:600;color:var(--title);padding:4px 6px}
.tile.used{background:var(--block);box-shadow:none;color:var(--dim)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:52px;border-radius:14px;background:var(--card);box-shadow:var(--sh2);text-align:left;padding:12px 16px;font-size:16px;font-weight:600;color:var(--title)}
.taps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:16px 8px;border-radius:18px;background:var(--block)}
.tapw{min-height:52px;min-width:52px;padding:0 14px;border-radius:14px;background:var(--card);box-shadow:var(--sh2);font-size:20px;font-weight:600;color:var(--title)}
.opt.sel,.tapw.sel{background:var(--lav-bg);color:var(--lav-deep);box-shadow:inset 0 0 0 2px var(--lav)}
.opt.ok,.tapw.ok{background:var(--amber-bg);color:var(--amber-text);box-shadow:inset 0 0 0 2px var(--amber)}
.opt.no,.tapw.no{background:var(--red-bg);color:var(--red-text);box-shadow:inset 0 0 0 2px var(--red)}
.verdict{display:flex;flex-direction:column;gap:6px}
.verdict .t20.ok{color:var(--amber-text)} .verdict .t20.no{color:var(--red-text)}
.tr{font-size:14px;color:var(--text)}

/* 리포트 */
.hero{font-size:52px;font-weight:700;letter-spacing:-.03em;color:var(--title);line-height:1;font-variant-numeric:tabular-nums}
.hero small{font-size:20px;font-weight:600;color:var(--sub);letter-spacing:-.02em}
.box{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:24px;background:var(--card);box-shadow:var(--sh2)}
.pair{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .k{width:56px;flex:none;font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--sub)}
.chip{min-height:36px;max-width:calc(100% - 62px);display:inline-flex;align-items:center;padding:6px 12px;border-radius:18px;background:var(--block);font-size:14px;font-weight:600;color:var(--title)}
.chip.bad{background:var(--red-bg);color:var(--red-text);box-shadow:inset 0 0 0 1.5px var(--red)}
.chip.good{background:var(--amber-bg);color:var(--amber-text)}

/* 지도 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px 12px;border-radius:16px;background:var(--card);box-shadow:var(--sh1);min-width:0}
.stat .t20{font-variant-numeric:tabular-nums}
.map{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cell{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--block);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}
button.cell{cursor:pointer}
.cell.done{background:var(--amber-bg);color:var(--amber-text);font-weight:600}
.cell.weak{background:var(--red-bg);color:var(--red-text);font-weight:600}
.cell.next{box-shadow:inset 0 0 0 2px var(--lav);color:var(--lav-deep);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--block)}
.legend i.done{background:var(--amber-bg);box-shadow:inset 0 0 0 1px var(--amber)} .legend i.weak{background:var(--red-bg);box-shadow:inset 0 0 0 1px var(--red)} .legend i.next{box-shadow:inset 0 0 0 2px var(--lav)}
.test{display:flex;flex-direction:column;gap:4px;padding-top:16px;border-top:1px solid var(--line)}

.pg { position: relative; margin: 0; max-width: 100%; container-type: inline-size; cursor: pointer; border-radius: 6px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
.pg img { display: block; width: 100%; height: auto; }
.pg:focus-visible { outline: 3px solid var(--title); outline-offset: 3px; }
.pg.off .b { visibility: hidden; }

.b { --u: calc(100cqw / 390); position: absolute; margin: 0; box-sizing: border-box; width: max-content; max-width: 62%; text-wrap: balance; }
.say, .call { padding: calc(var(--u) * 8) calc(var(--u) * 12); border-radius: calc(var(--u) * 16); background: var(--b-fill); border: calc(var(--u) * 1.5) solid var(--b-ink); color: var(--b-ink); font-size: calc(var(--u) * 14); font-weight: 600; line-height: 1.35; }
.call { border-style: dashed; }
.cap { padding: calc(var(--u) * 6) calc(var(--u) * 10); border-radius: calc(var(--u) * 6); background: var(--cap-fill); color: var(--cap-ink); font-size: calc(var(--u) * 12); font-weight: 500; letter-spacing: .08em; white-space: nowrap; }
.note { padding: calc(var(--u) * 5) calc(var(--u) * 7); border-radius: calc(var(--u) * 3); background: var(--paper); color: var(--b-ink); font-size: calc(var(--u) * 12); font-weight: 500; line-height: 1.3; box-shadow: 0 1px 3px rgba(100, 80, 60, .25); transform: rotate(var(--r, 0deg)); transform-origin: left top; }
.msg { padding: calc(var(--u) * 7) calc(var(--u) * 11); border-radius: calc(var(--u) * 14) calc(var(--u) * 14) calc(var(--u) * 14) calc(var(--u) * 4); background: var(--msg); color: var(--b-ink); font-size: calc(var(--u) * 13); font-weight: 500; line-height: 1.35; }
.tail { position: absolute; bottom: calc(var(--u) * -7); left: clamp(calc(var(--u) * 8), calc(var(--tx) * 1cqw - var(--u) * 7.5), calc(100% - var(--u) * 20)); width: calc(var(--u) * 12); height: calc(var(--u) * 12); background: var(--b-fill); border-right: calc(var(--u) * 1.5) solid var(--b-ink); border-bottom: calc(var(--u) * 1.5) solid var(--b-ink); transform: rotate(45deg); }
.tail.up { bottom: auto; top: calc(var(--u) * -7); border: 0; border-left: calc(var(--u) * 1.5) solid var(--b-ink); border-top: calc(var(--u) * 1.5) solid var(--b-ink); }
.tail.right { bottom: auto; left: auto; right: calc(var(--u) * -7); top: calc(50% - var(--u) * 6); border: 0; border-top: calc(var(--u) * 1.5) solid var(--b-ink); border-right: calc(var(--u) * 1.5) solid var(--b-ink); }
.tail.left { bottom: auto; left: calc(var(--u) * -7); top: calc(50% - var(--u) * 6); border: 0; border-bottom: calc(var(--u) * 1.5) solid var(--b-ink); border-left: calc(var(--u) * 1.5) solid var(--b-ink); }
@media (prefers-reduced-motion: no-preference) { .b { transition: opacity .15s; } }

  q.tr.split("|").forEach(p=>{const i=p.indexOf(":");m[p.slice(0,i).trim()]=p.slice(i+1).trim().toLowerCase().split(/\s+/)});
  const Sw=m["누가"]||[],Vw=m["한다"]||[];
  q.tileRole=q.words.map(w=>{const t=w.toLowerCase().split(/\s+/);return t.some(x=>Vw.includes(x))?"V":t.every(x=>Sw.includes(x))?"S":"O"})}));
const cap=s=>s[0].toUpperCase()+s.slice(1);
const sentence=ws=>cap(ws.join(" "))+".";
const norm=s=>s.toLowerCase().replace(/[.!?]/g,"").replace(/\s+/g," ").trim();
const collapse=rs=>rs.filter((r,i)=>r!==rs[i-1]).join("");

/* 순서 놓기에서 빨갛게 짚을 덩어리 */
function badIdx(h,rs){const at=[];rs.forEach((r,i)=>{
  if((h==="swap"&&r!=="V")||((h==="last"||h==="first"||h==="verb")&&r==="V")||(h==="front"&&r==="O"&&i<rs.indexOf("S"))||(h==="chunk"&&r==="O"))at.push(i)});return at}
function result(n){
  const L=BY[n],H=HABITS[n],st=LS(n),ans=(st.quiz&&st.quiz.ans)||[];
  const ok=ans.filter(a=>a&&a.ok).length,cnt={};
  ans.forEach(a=>{if(a&&!a.ok)cnt[a.h]=(cnt[a.h]||0)+1});
  const top=H.rank.slice().sort((a,b)=>(cnt[b]||0)-(cnt[a]||0))[0];
  const h=cnt[top]?top:null,bad=ans.filter(a=>a&&!a.ok&&a.h===h);
  return{ok,n:L.qs.length,h,ex:h?(bad.find(a=>a.ws)||bad[0]):null};   /* 보기는 순서 놓기에서 먼저 — 칸이 눈에 보인다 */
}

/* ── 화면 바꾸기: #home #map #l1-webtoon #l1-words #l1-game #l1-quiz #l1-report … ── */
const STEPS=["webtoon","words","game","quiz"];
let CUR=1;
function parse(h){const m=/^l(\d+)-(webtoon|words|game|quiz|report)$/.exec(h);return m?{n:+m[1],v:m[2]}:{n:null,v:h}}
function show(h){
  if(SITE){const p=parse(h);if(!p.n||!BY[p.n]){const n=plan().n;
    if(BY[n])go("l"+n+"-"+(LS(n).done?"report":LS(n).step||"webtoon"));else location.replace("../card.html?id="+n);return}}
  let {n,v}=parse(h);
  if(n&&!BY[n]){n=null;v="home"}
  if(!n&&v!=="map")v="home";
  if(n&&v==="report"&&!LS(n).done)v=LS(n).step||"webtoon";
  if(n)CUR=n;
  ["home","map","webtoon","words","game","quiz","report"].forEach(x=>$("v-"+x).hidden=x!==v);
  $("bar").hidden=!STEPS.includes(v);
  if(n){
    const L=BY[n],st=LS(n);
    $("b-home").textContent=SITE?"← 목록":"홈 · "+n+"과";
    if(SITE)$("b-side").innerHTML='<a href="../card.html?id='+n+'">설명 보기</a>';
    document.querySelectorAll(".step").forEach(b=>{const s=b.dataset.step;b.classList.toggle("now",s===v);b.classList.toggle("done",s!==v&&!!(st.did||{})[s])});
    if(STEPS.includes(v)){st.step=v;touch()}
    document.querySelectorAll(".wt[data-l]").forEach(w=>w.hidden=+w.dataset.l!==n);
    $("w-label").textContent="우리들의 리듬 · "+L.hwa+"화";
    $("d-label").textContent=L.words.label;$("d-sub").textContent=L.words.sub;$("g-sub").textContent=L.game.sub;
    if(v==="words"||v==="game"){const f=$("f-"+v),file=L[v].file;if(f.dataset.cur!==file){f.dataset.cur=file;f.src=file}}
  }
  ping(n,v,v==="report"?result(n).h:null);
  ({home:drawHome,quiz:drawQuiz,report:drawReport,map:drawMap}[v]||(()=>{}))();
  window.scrollTo(0,0);
}
function go(h){if(location.hash==="#"+h)show(h);else location.hash=h}
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
document.addEventListener("click",e=>{const b=e.target.closest("[data-go],[data-step]");if(!b||b.classList.contains("cell"))return;
  if(b.dataset.mark){const st=LS(CUR);st.did=st.did||{};st.did[b.dataset.mark]=true;save()}
  if(SITE&&(b.dataset.go==="home"||b.dataset.go==="map")){location.href="../grammar.html#month-"+Math.ceil(CUR/8);return}
  go(b.dataset.go||("l"+CUR+"-"+b.dataset.step))});

$("f-words").addEventListener("load",()=>{const f=$("f-words");
  const fit=()=>{try{const h=f.contentDocument.documentElement.scrollHeight;if(h>200)f.style.height=h+"px"}catch(e){}};
  fit();setTimeout(fit,400);try{f.contentWindow.addEventListener("resize",fit)}catch(e){}});

/* 웹툰: 그림을 누르면 말풍선 끄고 켜기 */
document.querySelectorAll(".pg").forEach(f=>{const t=()=>{const off=f.classList.toggle("off");f.setAttribute("aria-pressed",String(!off))};
  f.addEventListener("click",t);f.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t()}})});

/* 다음 과: 있으면 연다. 아직 없는 과는 누른 횟수를 센다 — 이번 시험이 보려는 숫자 */
function press(n,msgEl){S.press=(S.press||0)+1;S.pressAt=S.pressAt||[];S.pressAt.push(n+"과 "+new Date().toISOString());save();
  msgEl.hidden=false;msgEl.textContent=n+"과는 지금 만드는 중이에요. 열리면 여기서 바로 시작해요."}
function openNext(n,msgEl){if(BY[n])go("l"+n+"-webtoon");else if(SITE)location.href="../card.html?id="+n;else press(n,msgEl)}
function plan(){
  for(const L of LESSONS){const st=LS(L.n);
    if(!st.done){const p=L.n>1?LS(L.n-1):null;
      if(p&&p.done&&!st.step&&result(L.n-1).h)return{k:"retry",n:L.n-1};
      return{k:"go",n:L.n}}}
  const last=LESSONS[LESSONS.length-1].n;
  return result(last).h?{k:"retry",n:last}:{k:"soon",n:last+1};
}

/* ① 홈 */
function drawHome(){
  const p=plan(), msg=$("h-msg"), alt=$("h-alt"), btn=$("h-go"), flow=$("h-flow"); msg.hidden=true; alt.hidden=true;
  if(p.k==="go"){const L=BY[p.n],st=LS(p.n);
    $("h-label").textContent="오늘 할 것";$("h-title").textContent=p.n+"과";$("h-sub").textContent=L.sub;
    flow.innerHTML="<b>웹툰 "+L.hwa+"화</b> → <b>낱말 셋</b> → <b>기차 게임</b> → <b>문제 "+L.qs.length+"개</b> → 리포트";
    btn.textContent=st.step?"이어서 하기":p.n+"과 시작";btn.onclick=()=>go("l"+p.n+"-"+(st.step||"webtoon"));$("h-img").src="img/char-go.webp";
  }else if(p.k==="retry"){const r=result(p.n),H=HABITS[p.n][r.h];

    alt.hidden=false;alt.textContent=(p.n+1)+"과로 넘어가기";alt.onclick=()=>openNext(p.n+1,msg);
  }else{const prev=BY[p.n-1],r=result(p.n-1);
    $("h-label").textContent="오늘 할 것";$("h-title").textContent=p.n+"과";$("h-sub").textContent=prev.nextHint;
    flow.innerHTML=(p.n-1)+"과 <b>"+r.ok+" / "+r.n+"</b> · 틀린 칸 없음";
    btn.textContent=p.n+"과 시작";btn.onclick=()=>press(p.n,msg);$("h-img").src="img/char-win.webp";
  }
}

/* ③ 문제 */
let cur={key:"",picked:[],sel:null,graded:false};
const TYPE={order:"순서 놓기",choice:"고르기",tap:"누르기"};
function quizOf(){const st=LS(CUR);st.quiz=st.quiz||{i:0,ans:[]};const key=CUR+"-"+st.quiz.i;if(cur.key!==key)cur={key,picked:[],sel:null,graded:false};return st.quiz}
function drawQuiz(){
  const L=BY[CUR],Q=quizOf();
  if(Q.i>=L.qs.length){LS(CUR).done=true;save();go("l"+CUR+"-report");return}
  const q=L.qs[Q.i], t=q.t;
  $("q-n").textContent=CUR+"과 · 문제 "+(Q.i+1)+" / "+L.qs.length+" · "+TYPE[t];
  $("q-ctx").hidden=!q.ctx;$("q-ctx").textContent=q.ctx||"";
  $("q-text").textContent=q.q;
  $("q-en").hidden=!(t==="choice"&&q.en);$("q-en").textContent=q.en||"";
  $("q-slots").hidden=$("q-tiles").hidden=t!=="order";$("q-opts").hidden=t!=="choice";$("q-taps").hidden=t!=="tap";
  if(t==="order"){
    const slots=$("q-slots"),cols="repeat("+Math.min(q.words.length,4)+",1fr)";slots.className="slots";slots.style.gridTemplateColumns=cols;$("q-tiles").style.gridTemplateColumns=cols;
    slots.innerHTML=q.words.map((w,i)=>{const k=cur.picked[i];return `<button class="slot${k!=null?" full":""}" data-s="${i}">${k!=null?q.words[k]:""}</button>`}).join("");
    $("q-tiles").innerHTML=q.words.map((w,i)=>`<button class="tile${cur.picked.includes(i)?" used":""}" data-t="${i}">${w}</button>`).join("");
  }else if(t==="choice"){
    $("q-opts").innerHTML=q.opts.map((o,i)=>`<button class="opt${cur.sel===i?" sel":""}" data-o="${i}">${o.t}</button>`).join("");
  }else{
    $("q-taps").innerHTML=q.en.split(" ").map((w,i)=>`<button class="tapw${cur.sel===i?" sel":""}" data-o="${i}">${w}</button>`).join("");
  }
  $("q-verdict").hidden=true;
  const g=$("q-go");g.textContent="확인";g.disabled=t==="order"?cur.picked.length<q.words.length:cur.sel==null;
  if(cur.graded)grade(true);
}
$("q-tiles").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b||cur.graded)return;const i=+b.dataset.t;
  const at=cur.picked.indexOf(i);if(at>=0)cur.picked.splice(at,1);else cur.picked.push(i);drawQuiz()});
$("q-slots").addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(!b||cur.graded)return;const s=+b.dataset.s;
  if(cur.picked[s]!=null){cur.picked.splice(s,1);drawQuiz()}});
["q-opts","q-taps"].forEach(id=>$(id).addEventListener("click",e=>{const b=e.target.closest("[data-o]");if(!b||cur.graded)return;cur.sel=+b.dataset.o;drawQuiz()}));
function grade(redraw){
  const L=BY[CUR],H=HABITS[CUR],Q=quizOf(),q=L.qs[Q.i];let rec;
  if(q.t==="order"){
    const ws=cur.picked.map(i=>q.words[i]), rs=cur.picked.map(i=>q.tileRole[i]), ok=norm(sentence(ws))===norm(q.a);
    rec={ok,h:ok?null:H.order(collapse(rs)),ws,rs,got:sentence(ws),a:q.a};
    $("q-slots").classList.add(ok?"ok":"no");
    if(!ok)badIdx(rec.h,rs).forEach(i=>{const s=$("q-slots").children[i];if(s)s.classList.add("bad")});
  }else{
    const ok=cur.sel===q.ok, words=q.t==="tap"?q.en.split(" "):null;
    const h=ok?null:q.t==="choice"?q.opts[cur.sel].h:(q.h||H.tap(q,cur.sel));
    rec=q.t==="choice"?{ok,h,got:q.opts[cur.sel].t,a:q.opts[q.ok].t}:{ok,h,got:words[cur.sel],a:words[q.ok]};
    [...$(q.t==="choice"?"q-opts":"q-taps").children].forEach((b,i)=>{b.classList.remove("sel");if(i===q.ok)b.classList.add("ok");else if(i===cur.sel)b.classList.add("no")});
  }
  rec.q=q.q;rec.i=Q.i;
  if(!redraw){Q.ans[Q.i]=rec;save()}
  cur.graded=true;
  $("q-verdict").hidden=false;
  $("q-v1").className="t20 "+(rec.ok?"ok":"no");
  $("q-v1").textContent=rec.ok?"맞았어요":q.t==="order"?"맞는 순서는 "+q.a:"정답은 「"+rec.a+"」";
  $("q-tr").hidden=!q.tr;$("q-tr").textContent=q.tr||"";$("q-why").textContent=q.why;
  const g=$("q-go");g.disabled=false;g.textContent=Q.i===L.qs.length-1?"리포트 보기":"다음 문제";
}
$("q-go").onclick=()=>{
  if(!cur.graded){grade(false);return}
  const L=BY[CUR],st=LS(CUR),Q=quizOf();Q.i++;st.did=st.did||{};
  if(Q.i>=L.qs.length){st.did.quiz=true;st.done=true;st.doneAt=today();save();
    if(SITE)try{const k="samdol-grammar-done",d=JSON.parse(localStorage.getItem(k)||"{}")||{};d[CUR]=true;localStorage.setItem(k,JSON.stringify(d))}catch(e){}   /* 목록 · 홈의 읽음 표시 */
    go("l"+CUR+"-report");return}
  save();drawQuiz();window.scrollTo(0,0);
};

/* ④ 리포트: 틀린 칸 하나 + 다음 할 것 하나 */
function chips(ws,bad,cls){return ws.map((w,i)=>`<span class="chip ${bad.includes(i)?"bad":cls||""}">${i?w:cap(w)}</span>`).join("")}
function drawReport(){
  const n=CUR,L=BY[n],r=result(n), msg=$("r-msg"), alt=$("r-alt"), g=$("r-go"); msg.hidden=true; alt.hidden=true;
  $("r-title").textContent=n+"과 리포트";
  $("r-score").innerHTML=r.ok+"<small> / "+r.n+"</small>";
  const seen=gameSeen(L);$("r-game").textContent=seen?"기차 장면 "+seen+" / "+L.game.total+" 봤어요":"";
  if(r.h){
    const H=HABITS[n][r.h], ex=r.ex, q=L.qs[ex.i];
    $("r-img").src="img/char-think.webp";
    $("r-klabel").textContent="틀린 칸 · "+H.k;$("r-habit").textContent=H.line;
    $("r-pair").innerHTML=ex.ws?`<p class="t14">${ex.q.replace(/를 평서문으로.*$/,"")}</p>
      <div class="chips"><span class="k">놓은 것</span>${chips(ex.ws,badIdx(r.h,ex.rs||[]))}</div>
      <div class="chips"><span class="k">맞는 것</span><span class="chip good">${q.a}</span></div>`
      :`<p class="t14">${ex.q}${q.en?" · "+q.en.replace(/\n/g," / "):""}</p>
      <div class="chips"><span class="k">고른 것</span><span class="chip bad">${ex.got}</span></div>
      <div class="chips"><span class="k">맞는 것</span><span class="chip good">${ex.a}</span></div>`;
    $("r-next").textContent=H.next;
    g.textContent="기차 게임 열기";g.onclick=()=>go("l"+n+"-game");
    alt.hidden=false;alt.textContent=(n+1)+"과로 넘어가기";alt.onclick=()=>openNext(n+1,msg);
  }else{
    $("r-img").src="img/char-win.webp";
    $("r-klabel").textContent="틀린 칸";$("r-habit").textContent="틀린 칸이 없어요. "+r.n+"문제 모두 "+L.allGood;
    $("r-pair").innerHTML="";
    $("r-next").textContent=(n+1)+"과로 가세요. "+L.nextHint;
    g.textContent=(n+1)+"과 시작";g.onclick=()=>openNext(n+1,msg);
  }
}

/* ② 지도 */
function drawMap(){
  const p=plan(), doneN=LESSONS.filter(L=>LS(L.n).done).map(L=>L.n);
  $("m-to").textContent=(doneN.length?Math.max(...doneN):0)+"과";
  const now=new Date(), mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));mon.setHours(0,0,0,0);
  $("m-days").textContent=(S.days||[]).filter(d=>new Date(d+"T00:00:00")>=mon).length+"일";
  const lastWeak=doneN.slice().reverse().map(n=>[n,result(n).h]).find(x=>x[1]);
  $("m-weak").textContent=lastWeak?HABITS[lastWeak[0]][lastWeak[1]].short:"없음";
  const target=p.k==="go"?p.n:p.k==="soon"?p.n:p.n+1;
  const st=n=>BY[n]&&LS(n).done?(result(n).h?"weak":"done"):n===target?"next":"";
  let h="";for(let row=0;row<4;row++){h+='<div class="mrow">';for(let c=1;c<=8;c++){const n=row*8+c;
    h+=BY[n]?`<button class="cell ${st(n)}" data-l="${n}" aria-label="${n}과 열기">${n}</button>`:`<div class="cell ${st(n)}">${n}</div>`}h+="</div>"}
  $("m-map").innerHTML=h;
  $("m-press").textContent="아직 없는 과 버튼 누른 횟수 "+(S.press||0);
  const rb=$("m-reset");rb.textContent="기록 지우기";rb.dataset.arm="";
}
$("m-map").addEventListener("click",e=>{const b=e.target.closest("button[data-l]");if(!b)return;const n=+b.dataset.l,st=LS(n);
  go("l"+n+"-"+(st.done?"report":st.step||"webtoon"))});
$("m-reset").onclick=()=>{const b=$("m-reset");
  if(!b.dataset.arm){b.dataset.arm="1";b.textContent="한 번 더 누르면 이 폰의 기록이 다 지워져요";return}
  S={};cur={key:"",picked:[],sel:null,graded:false};
  try{localStorage.removeItem(K);LESSONS.forEach(L=>localStorage.removeItem(L.game.seenKey))}catch(e){}
  ["f-game","f-words"].forEach(id=>{const f=$(id);f.removeAttribute("src");delete f.dataset.cur});drawMap()};

if(SITE){document.querySelectorAll('#v-report [data-go="home"]').forEach(b=>b.textContent="목록");document.querySelectorAll('#v-report [data-go="map"]').forEach(b=>b.hidden=true)}
show(location.hash.slice(1));
</script>
