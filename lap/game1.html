<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>못삼영 기차 놀이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 짜임: 폰 한 화면. 위에서부터 한 줄 뜻 → 무대 → 기차 세 칸 → 낱말 여섯 → 출발
   움직임은 전부 코드(WAAPI)가 한다. 컴의 「움직임 줄이기」 설정에 걸리지 않게 CSS 움직임은 쓰지 않는다 */
:root{
  --bg:#FAFAF8; --card:#FFFFFF; --block:#F5F3EF; --line:#E8E4DC; --line2:#D8D2C6;
  --text:#4A4039; --title:#2C2420; --sub:#6E645A; --dim:#9C9288;
  --lav-bg:#F2EFF9; --lav:#7C6BAE; --lav-deep:#54487A;
  --amber-bg:#FDF8E7; --amber:#E8C547; --amber-text:#9A6E1E;
  --red:#C04040; --dark:#2C2420; --hill1:#F1EEF7; --hill2:#F3EEE2;
  --font:"Pretendard","Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --sh1:0 1px 3px rgba(100,80,60,.05); --sh2:0 2px 12px rgba(100,80,60,.06);
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;font-weight:500;letter-spacing:-.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;user-select:none;-webkit-user-select:none}
.app{max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--lav);outline-offset:2px}

.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.head h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--title);text-wrap:balance}
.head h1 b{color:var(--lav-deep);font-weight:600}
.pills{flex:none;display:flex;align-items:center;gap:6px}
.seen,.snd span{font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--sub);font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:999px;background:var(--block);white-space:nowrap}
.seen.new{background:var(--amber-bg);color:var(--amber-text)}
.snd{min-height:44px;display:flex;align-items:center}

.stage{position:relative;height:clamp(150px,27dvh,280px)}
.stage.quiz #a-piz{display:none}
.scene{position:absolute;inset:-40px -200px 0;overflow:hidden;pointer-events:none}
.scene svg{position:absolute;left:0;bottom:0;width:100%;height:70%}
.cloud{position:absolute;left:0;opacity:.9}
.floor{position:absolute;left:-200px;right:-200px;bottom:16px;height:2px;background:var(--line)}
.actor{position:absolute;bottom:18px;left:0;will-change:transform}
.lift,.in{display:block}
.in{transform-origin:50% 100%}
.idle{display:flex;align-items:flex-end;justify-content:center;height:100%;transform-origin:50% 100%}
.idle img,.idle svg{display:block;height:100%;width:auto;max-width:none}
#a-sam .in{height:100px} #a-mot .in{height:114px} #a-piz .in{height:52px}
.fx{position:absolute;left:0;top:0;pointer-events:none}
.dust{width:12px;height:12px;border-radius:50%;background:var(--line2)}

.say{min-height:50px;text-align:center}
.say .en{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--title)}
.say .ko{font-size:14px;font-weight:400;color:var(--sub);margin-top:2px}

.train{position:relative;display:flex;align-items:flex-end;padding-top:22px}
.car{position:relative;z-index:1;min-height:44px;transform-origin:50% 100%}
.car img{display:block;width:100%}
.car.s{width:32.3%} .car.v{width:26.6%} .car.o{width:27%}
.link{width:16.3%;margin:0 -4.6% 3.5%;z-index:0}
.tag{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);min-width:58%;padding:5px 8px;border-radius:999px;
  background:var(--card);box-shadow:var(--sh1);font-size:14px;font-weight:600;color:var(--title);text-align:center;white-space:nowrap}
.car.s .tag{left:56%}
.tag.empty{background:rgba(255,255,255,.35);box-shadow:none;border:1.5px dashed rgba(44,36,32,.4);color:transparent}
.glow{position:absolute;left:50%;top:7%;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);opacity:0;
  box-shadow:0 0 22px 14px rgba(232,197,71,.8)}
.car.v.on .glow{opacity:1}
.smoke{position:absolute;left:5.5%;top:0;width:9%;opacity:0;pointer-events:none}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{min-height:50px;border-radius:14px;background:var(--card);box-shadow:var(--sh2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tile .en{font-size:16px;font-weight:600;color:var(--title)}
.tile .ko{font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--dim)}
.tile.used{background:var(--block);box-shadow:none}
.tile.used .en{color:var(--dim)}
.fly{position:fixed;left:0;top:0;z-index:9;padding:5px 12px;border-radius:999px;background:var(--card);box-shadow:0 6px 28px rgba(100,80,60,.10);
  font-size:14px;font-weight:600;color:var(--title);pointer-events:none;white-space:nowrap}

.go-btn{min-height:52px;border-radius:16px;background:var(--dark);color:#FAFAF8;font-size:16px;font-weight:600}
.go-btn:disabled{background:var(--block);color:var(--dim);cursor:default}
.modes{position:relative;z-index:2;display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--block);align-self:center}
.mode{min-height:40px;padding:0 20px;border-radius:999px;font-size:14px;font-weight:600;color:var(--sub)}
.mode.on{background:var(--card);box-shadow:var(--sh1);color:var(--title)}
</style>

<div class="app">
  <div class="head">
    <h1>영어는 <b>먼저 나온 쪽이 주인공</b>이다</h1>
    <div class="pills">
      <button class="snd" id="snd" aria-pressed="true"><span>소리 켬</span></button>
      <div class="seen" id="seen">0 / 14</div>
    </div>
  </div>

  <div class="modes" role="group" aria-label="놀이 방식">
    <button class="mode on" data-m="play" aria-pressed="true">놀이</button>
    <button class="mode" data-m="quiz" aria-pressed="false">연습문제</button>
  </div>

  <div class="stage" id="stage">
    <div class="scene" id="scene">

function ac(){ if(!soundOn)return null;
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null}
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(AC.state==="suspended")AC.resume(); return AC;}
function tone(f,dur,o={}){const c=ac();if(!c)return;const t=c.currentTime+(o.at||0),os=c.createOscillator(),g=c.createGain();
  os.type=o.type||"triangle";os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.vol||.12,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  os.connect(g).connect(c.destination);os.start(t);os.stop(t+dur+.02);}
function noise(dur,o={}){const c=ac();if(!c)return;const t=c.currentTime+(o.at||0),s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();
  s.buffer=noiseBuf;f.type="bandpass";f.frequency.value=o.f||900;f.Q.value=.8;
  g.gain.setValueAtTime(o.vol||.12,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f).connect(g).connect(c.destination);s.start(t);s.stop(t+dur+.02);}
const SFX={
  pick(){tone(620,.07,{to:900,vol:.1})},

function tw(el,to,ms,ease){const from=getComputedStyle(el).transform;el.style.transform=to;
  if(ms)el.animate([{transform:from},{transform:to||"none"}],{duration:ms,easing:ease||SPRING});return sleep(ms||0);}
function kf(el,frames,ms,o={}){const an=el.animate(frames,Object.assign({duration:ms,easing:"ease-out"},o));
  const p=sleep(ms+(o.delay>0?o.delay:0));an.done=p;an.then_=f=>p.then(f);return an;}

function inner(k,t,ms=260,ease){return tw(part(k,"in"),t,ms,ease);}
function setPose(k,name){const P=POSE[k];if(!P)return;const p=P[name]||P.stand,img=A(k).querySelector("img");

function jump(k,h=22,ms=340){return kf(part(k,"lift"),[{transform:"translateY(0)"},{transform:`translateY(${-h}px)`,offset:.45},{transform:"translateY(0)"}],ms,{easing:"ease-in-out"}).done;}
function squash(k){return kf(part(k,"in"),[{transform:"scale(1.18,.82)"},{transform:"scale(.94,1.08)",offset:.5},{transform:getComputedStyle(part(k,"in")).transform}],240);}
function fxAt(x,yUp,cls,html){const d=document.createElement("div");d.className="fx "+(cls||"");if(html)d.innerHTML=html;

  setInterval(()=>{if(touched||busy)return;[...tilesEl.children].forEach((t,i)=>kf(t,[{transform:"translateY(0)"},{transform:"translateY(-7px)"},{transform:"translateY(0)"}],320,{delay:i*90,easing:"ease-in-out"}));},3200);
}
function boot(){drawSnd();resetStage();draw();ambient();}
window.addEventListener("resize",()=>{if(!busy)resetStage()});
if(document.readyState==="complete")boot();else window.addEventListener("load",boot);
</script>
