<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>못난이삼돌이 영문법</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF8; --surface:#F5F3EF; --card:#FFFDF9;
    --ink:#2C2420; --ink2:#6B6259; --ink3:#8E8577; --ink4:#A69D8E; --ink5:#C4BDB0;
    --line:#E8E4DC;
    --violet:#B8A9D9; --violet-d:#A395CB; --violet-t:#7C6BAE;
    --gold:#E8C547; --gold-t:#9A7B1E; --gold-ink:#5C4708;
    --serif:'Pretendard Variable','Pretendard',sans-serif; --sans:'Pretendard Variable','Pretendard',sans-serif; --mono:'DM Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    background-image:radial-gradient(rgba(120,100,80,.035) 1px,transparent 1px);
    background-size:4px 4px;
    font-family:var(--sans); color:var(--ink);
    word-break:keep-all; -webkit-text-size-adjust:100%;
  }
  a{color:var(--violet-t);text-decoration:none}

  header{position:sticky;top:0;z-index:20;background:rgba(250,250,248,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .hbar{max-width:780px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .back{display:flex;align-items:center;gap:9px;color:var(--ink2);font-size:14px}
  .back img{width:28px;height:28px;object-fit:contain;object-position:top}
  .back:hover{color:var(--ink)}
  .mtag{font-family:var(--mono);font-size:12px;color:var(--ink3);letter-spacing:.06em}

  main{max-width:780px;margin:0 auto;padding:36px 24px 0}

  .badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .tag{background:var(--surface);color:var(--ink3);font-size:12px;padding:6px 13px;border-radius:999px}
  h1{font-family:var(--serif);font-weight:800;font-size:34px;line-height:1.34;letter-spacing:-.02em;margin:0 0 22px}

  .prog{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  .bar{flex:1;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
  .bar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--gold))}
  .prog span{font-family:var(--mono);font-size:12px;color:var(--ink4);flex:none}

  .drama{background:var(--ink);border-radius:24px;padding:32px 36px;margin-bottom:32px;color:#EDE7E2}
  .dhead{display:flex;align-items:baseline;gap:10px;padding-bottom:16px;margin-bottom:22px;border-bottom:1px solid rgba(255,253,249,.14)}
  .dtitle{font-family:var(--serif);font-weight:700;font-size:17px;color:#FFFDF9}
  .dsub{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.1em}
  .ep+.ep{margin-top:32px;padding-top:28px;border-top:1px solid rgba(255,253,249,.12)}
  .ep h3{margin:0 0 18px;font-family:var(--mono);font-size:12px;font-weight:400;color:var(--gold);letter-spacing:.08em}
  .ep h3 em{font-family:var(--serif);font-style:normal;font-weight:700;font-size:15px;color:#FFFDF9;margin-left:8px;letter-spacing:0}
  .drama p{margin:0 0 11px;font-size:15.5px;line-height:1.85}
  .place{color:var(--gold);font-size:13px!important;letter-spacing:.02em;margin-bottom:16px!important}
  .dir{color:#A29A93;font-size:14px!important;line-height:1.8!important}
  .line{color:#EDE7E2}
  .line b{display:inline-block;min-width:60px;font-weight:500;color:var(--violet);margin-right:8px}


  @media (max-width:640px){
    .drama{padding:24px 20px;border-radius:20px}
    .line b{display:block;min-width:0;margin:0 0 2px}
  }

  article{background:var(--card);border-radius:24px;padding:38px 40px}
  article p{font-size:17px;line-height:1.95;color:#3D342E;margin:0 0 14px}
  article p:last-child{margin-bottom:0}
  article h2{
    font-family:var(--serif);font-weight:700;font-size:18px;color:var(--ink);
    margin:34px 0 16px;padding-bottom:9px;border-bottom:1px solid var(--line);letter-spacing:-.01em;
  }
  article h2:first-child{margin-top:0}

  article mark{background:rgba(232,197,71,.42);color:inherit;padding:1px 4px;border-radius:3px}

  .pull{
    font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.7;
    color:var(--violet-t);background:rgba(184,169,217,.14);
    margin:26px 0;padding:22px 26px;border-radius:16px;text-align:center;
  }
  .pull mark{background:rgba(232,197,71,.5)}
  article p+.pull{margin-top:26px}

  .note{display:flex;gap:12px;align-items:flex-start;margin:22px 0;padding:16px 20px;border-radius:14px}
  .note span{flex:none;font-size:16px;line-height:1.7}
  .note p{margin:0!important;font-size:15.5px!important;line-height:1.75!important}
  .note.warn{background:rgba(232,197,71,.16)}
  .note.aha{background:rgba(184,169,217,.16)}

  .formula{
    margin:28px 0;padding:28px 26px;border-radius:18px;background:var(--ink);
    text-align:center;font-family:var(--serif);font-weight:700;font-size:23px;color:#FFFDF9;line-height:1.6;
  }
  .formula .flabel{
    display:block;font-family:var(--mono);font-weight:400;font-size:11px;
    color:var(--gold);letter-spacing:.14em;margin-bottom:12px;
  }
  .formula mark{background:rgba(232,197,71,.35);color:#FFFDF9}

  .point{margin:26px 0 0;padding:22px 24px;border-radius:16px;background:var(--surface)}
  .point b{display:block;font-family:var(--serif);font-size:15px;color:var(--violet-t);margin-bottom:8px}
  .point p{margin:0!important;font-size:15.5px!important;line-height:1.8!important}

  .fig{margin:26px 0;padding:26px 20px 18px;border-radius:16px;background:var(--surface)}
  .train{display:flex;align-items:flex-end;justify-content:center;gap:0}
  .car{display:flex;flex-direction:column;align-items:center;gap:7px}
  .car .cap{font-size:12.5px;color:var(--ink3)}
  .car .box{
    width:62px;height:52px;border-radius:10px;display:grid;place-items:center;
    font-family:var(--mono);font-size:20px;color:#3D342E;
  }
  .link2{width:16px;height:3px;background:var(--ink5);margin:0 0 24px;border-radius:2px}
  .rail{height:3px;background:var(--ink5);border-radius:2px;margin:9px auto 0;max-width:300px;opacity:.6}
  .figcap{margin:12px 0 0!important;text-align:center;font-size:13px!important;color:var(--ink3)!important}

  .cmpwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}
  .cmp{padding:18px;border-radius:14px;text-align:center}
  .cmp.ko{background:rgba(232,197,71,.16)}
  .cmp.en{background:rgba(184,169,217,.16)}
  .cmp b{display:block;font-family:var(--serif);font-size:15px;margin-bottom:6px;color:var(--ink)}
  .cmp small{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:12px}
  .cmp .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .cmp .chips span{background:var(--card);font-size:13px;padding:5px 11px;border-radius:999px;color:var(--ink)}

  @media (max-width:640px){
    .pull{font-size:17px;padding:18px 20px}
    .formula{font-size:19px;padding:22px 18px}
    .cmpwrap{grid-template-columns:1fr}
    .car .box{width:52px;height:46px;font-size:17px}
  }

  .quizopen{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    margin:32px 0 0;padding:16px;border-radius:999px;border:none;
    background:var(--violet);color:#FFFDF9;font-family:var(--sans);font-size:15px;font-weight:500;
    cursor:pointer;transition:background .2s;
  }
  .quizopen:hover{background:var(--violet-d)}
  .quiz{margin-top:32px;background:var(--card);border-radius:24px;padding:32px 36px}
  .qcore{background:rgba(232,197,71,.16);border-radius:14px;padding:16px 20px;margin-bottom:26px;font-size:15px;line-height:1.75}
  .qcore b{display:block;font-family:var(--serif);font-size:14px;margin-bottom:6px}
  .qitem{padding:22px 0;border-top:1px solid var(--line)}
  .qitem:first-of-type{border-top:none;padding-top:0}
  .qnum{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .qnum b{width:26px;height:26px;border-radius:999px;background:var(--surface);color:var(--ink3);
    font-family:var(--mono);font-size:12px;font-weight:400;display:grid;place-items:center;flex:none}
  .qnum span{font-family:var(--mono);font-size:11px;color:var(--ink4);letter-spacing:.06em}
  .qctx{font-size:13px;color:var(--ink3);margin:0 0 10px}
  .qq{font-size:16.5px!important;line-height:1.8!important;margin:0 0 14px!important;white-space:pre-line}
  .qhint{font-size:13px;color:var(--ink4);margin:0 0 12px!important}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{text-align:left;padding:13px 16px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);font-family:var(--sans);font-size:15px;color:var(--ink);cursor:pointer;transition:.15s}
  .opt:hover{background:var(--surface)}
  .opt.ok{background:rgba(184,169,217,.22);border-color:var(--violet);color:var(--violet-t);font-weight:500}
  .opt.no{background:rgba(232,197,71,.14);border-color:var(--line);color:var(--ink4)}
  .fillrow{display:flex;gap:8px}
  .fillrow input{flex:1;padding:12px 15px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);font-family:var(--sans);font-size:15px;color:var(--ink)}
  .fillrow input:focus{outline:none;border-color:var(--violet)}
  .fillrow button,.showa{padding:12px 18px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);font-family:var(--sans);font-size:14px;color:var(--ink2);cursor:pointer;flex:none}
  .fillrow button:hover,.showa:hover{background:#EDEAE3}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .chip{padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);
    font-family:var(--sans);font-size:15px;color:var(--ink);cursor:pointer}
  .chip:hover{background:var(--surface)}
  .chip.used{opacity:.3;pointer-events:none}
  .tray{min-height:46px;padding:11px 15px;border-radius:12px;background:var(--surface);
    font-size:15px;color:var(--ink);margin-bottom:10px;cursor:pointer}
  .tray:empty::before{content:'단어를 눌러 순서대로 놓으세요';color:var(--ink5);font-size:14px}
  .verdict{margin-top:12px;font-size:14.5px;line-height:1.75;padding:12px 16px;border-radius:12px}
  .verdict.right{background:rgba(184,169,217,.16);color:var(--violet-t)}
  .verdict.wrong{background:rgba(232,197,71,.16);color:var(--gold-t)}
  .verdict b{font-weight:500}
  .qscore{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;font-size:15px}
  .qscore b{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--violet-t)}

  @media (max-width:640px){
    .quiz{padding:24px 20px;border-radius:20px}
    .qq{font-size:15.5px!important}
  }

  .readbtn{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    margin:28px 0 0;padding:16px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--ink2);font-family:var(--sans);font-size:15px;font-weight:500;
    cursor:pointer;transition:background .2s,color .2s,border-color .2s;
  }
  .readbtn:hover{background:var(--surface)}
  .readbtn.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}

  .practicebtn{display:block;text-align:center;margin-top:12px;padding:14px;border-radius:999px;
    background:var(--surface);color:var(--ink2);font-size:14px;font-weight:500;transition:background .2s}
  .practicebtn:hover{background:#EDEAE3;color:var(--ink2)}
  .practicebtn+.readbtn{margin-top:12px}

  .askbtn{display:block;text-align:center;margin-top:12px;padding:14px;border-radius:999px;
    background:var(--surface);color:var(--ink2);font-size:14px;font-weight:500;transition:background .2s}
  .askbtn:hover{background:#EDEAE3;color:var(--ink2)}

  nav.pager{display:flex;gap:14px;margin:32px 0 0}
  nav.pager a,nav.pager span{
    flex:1;background:var(--card);border-radius:20px;padding:18px 20px;
    color:var(--ink);transition:transform .2s;min-width:0;
  }
  nav.pager a:hover{transform:translateY(-2px);color:var(--ink)}
  nav.pager span{background:transparent}
  nav.pager .lbl{display:block;font-family:var(--mono);font-size:11px;color:var(--ink4);margin-bottom:6px;letter-spacing:.05em}
  nav.pager .ttl{display:block;font-size:14px;font-weight:500;line-height:1.5}
  nav.pager .next{text-align:right}

  .tolist{display:block;text-align:center;font-size:14px;color:var(--ink4);padding:22px 0}
  .tolist:hover{color:var(--ink2)}

  footer{max-width:780px;margin:0 auto;padding:8px 24px 60px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink4);border-top:1px solid var(--line);padding-top:26px}
  footer img{width:52px;height:52px;object-fit:contain;object-position:top;opacity:.9}

  .notfound{text-align:center;padding:20px 0 8px}
  .notfound img{width:200px;max-width:60%;display:block;margin:0 auto 20px}

  @media (max-width:640px){
    main{padding:24px 16px 0}
    .hbar,footer{padding-left:16px;padding-right:16px}
    h1{font-size:26px}
    article{padding:26px 22px;border-radius:20px}
    article p{font-size:16px;line-height:1.9}
    nav.pager{flex-direction:column;gap:10px}
    nav.pager .next{text-align:left}
    .mtag{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="hbar">
    <a class="back" href="index.html">
      <img src="images/samdol_default.webp" alt="">
      <span>← 목록으로</span>
    </a>
    <span class="mtag" id="mtag"></span>
  </div>
</header>

<main id="app"></main>

<footer>
  <span>© 못난이삼돌이 · The Simplest Line</span>
  <img src="images/samdol_warm.webp" alt="">
</footer>

<script src="data.js?v=20260920210000"></script>
<script src="scenes.js?v=20260920210000"></script>
<script src="quiz.js?v=20260920210000"></script>
<script>
(function(){
  var KEY='samdol-grammar-done';
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
  function save(d){try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}}

  var app=document.getElementById('app');
  var id=parseInt(new URLSearchParams(location.search).get('id'),10)||1;
  var idx=grammarData.findIndex(function(d){return d.id===id;});

  if(idx===-1){
    document.getElementById('mtag').textContent='';
    app.innerHTML=
      '<article class="notfound">'+
        '<img src="images/samdol_calm.webp" alt="">'+
        '<h1 style="font-size:24px;margin-bottom:10px">그런 과는 없어</h1>'+
        '<p style="color:var(--ink2)">01과부터 '+grammarData.length+'과까지 있어.</p>'+
      '</article>'+
      '<nav class="pager"><a href="index.html" style="text-align:center">'+
      '<span class="ttl">목록으로 돌아가기 →</span></a></nav>';
    return;
  }

  var d=grammarData[idx];
  var prev=grammarData[idx-1], next=grammarData[idx+1];
  var meta=monthMeta[d.month]||{label:'MONTH '+d.month,theme:''};
  document.title=d.title+' · 못난이삼돌이 영문법';
  document.getElementById('mtag').textContent=meta.label+' · '+meta.theme;

  // **강조** → 형광펜
  function mark(t){ return t.replace(/\*\*([^*]+)\*\*/g,'<mark>$1</mark>'); }

  function train(spec){
    var w=(spec||'주어 · 동사 · 목적어').split('·').map(function(x){return x.trim();});
    var cars=[['S',w[0]||'주어','#B8A9D9'],['V',w[1]||'동사','#E8C547'],['O',w[2]||'목적어','#F0A9A9']];
    return '<div class="fig">'+
      '<div class="train">'+cars.map(function(c){
        return '<div class="car"><span class="cap">'+esc(c[1])+'</span>'+
               '<span class="box" style="background:'+c[2]+'">'+c[0]+'</span></div>';
      }).join('<span class="link2"></span>')+'</div>'+
      '<div class="rail"></div>'+
      '<p class="figcap">칸 순서는 절대 바뀌지 않는다</p></div>';
  }

  function compare(spec){
    var p=(spec||'').split('::').map(function(x){return x.trim();});
    function col(t,o,ws,cls){
      return '<div class="cmp '+cls+'"><b>'+esc(t)+'</b><small>'+esc(o)+'</small>'+
        '<div class="chips">'+ws.split('/').map(function(x){
          return '<span>'+esc(x.trim())+'</span>';}).join('')+'</div></div>';
    }
    return '<div class="cmpwrap">'+col(p[0],p[1],p[2]||'','ko')+col(p[3],p[4],p[5]||'','en')+'</div>';
  }

  var body=d.content.map(function(l){
    if(l.indexOf('## ')===0)     return '<h2>'+mark(esc(l.slice(3)))+'</h2>';
    if(l.indexOf('> ')===0)      return '<blockquote class="pull">'+mark(esc(l.slice(2)))+'</blockquote>';
    if(l.indexOf('= ')===0)      return '<div class="formula"><span class="flabel">핵심 공식</span>'+mark(esc(l.slice(2)))+'</div>';
    if(l.indexOf('! ')===0)      return '<div class="note warn"><p>'+mark(esc(l.slice(2)))+'</p></div>';
    if(l.indexOf('~ ')===0)      return '<div class="note aha"><p>'+mark(esc(l.slice(2)))+'</p></div>';
    if(l.indexOf('+ ')===0)      return '<div class="point"><b>이 과의 핵심</b><p>'+mark(esc(l.slice(2)))+'</p></div>';
    if(l.indexOf('@train')===0)  return train(l.slice(6));
    if(l.indexOf('@compare')===0)return compare(l.slice(8));
    return '<p>'+mark(esc(l))+'</p>';
  }).join('');

  var pager=''
    + (prev?'<a href="card.html?id='+prev.id+'"><span class="lbl">← 이전</span><span class="ttl">'+esc(prev.title)+'</span></a>':'<span></span>')
    + (next?'<a class="next" href="card.html?id='+next.id+'"><span class="lbl">다음 →</span><span class="ttl">'+esc(next.title)+'</span></a>':'<span></span>');

  // 드라마 장면
  var scenes = (typeof dramaScenes!=='undefined' && dramaScenes[d.id]) || [];
  var dm = (typeof dramaByMonth!=='undefined' && dramaByMonth[d.month]) ||
    { title: (typeof dramaTitle!=='undefined'?dramaTitle:''), subtitle: (typeof dramaSubtitle!=='undefined'?dramaSubtitle:'') };
  var sceneHTML = scenes.length ? '<section class="drama">'+
    '<div class="dhead"><span class="dtitle">'+esc(dm.title)+'</span>'+
    '<span class="dsub">'+esc(dm.subtitle)+'</span></div>'+
    scenes.map(function(s){
      return '<div class="ep"><h3>EP.'+esc(s.no)+' <em>'+esc(s.title)+'</em></h3>'+
        s.lines.map(function(l){
          if(l.charAt(0)==='[') return '<p class="place">'+esc(l.replace(/^\[|\]$/g,''))+'</p>';
          if(l.charAt(0)==='(') return '<p class="dir">'+esc(l)+'</p>';
          var i=l.indexOf(': ');
          if(i>0 && i<12) return '<p class="line"><b>'+esc(l.slice(0,i))+'</b>'+esc(l.slice(i+2))+'</p>';
          return '<p class="dir">'+esc(l)+'</p>';
        }).join('')+'</div>';
    }).join('')+'</section>' : '';

  app.innerHTML=
    '<div class="badges">'+d.tags.map(function(t){return '<span class="tag">#'+esc(t)+'</span>';}).join('')+'</div>'+
    '<h1>'+esc(d.title)+'</h1>'+
    '<div class="prog"><div class="bar"><div style="width:'+Math.round((idx+1)/grammarData.length*100)+'%"></div></div>'+
    '<span>'+(idx+1)+' / '+grammarData.length+'</span></div>'+
    sceneHTML+
    '<article>'+body+'</article>'+
    (typeof quizData!=='undefined' && quizData[d.id]
      ? '<button class="quizopen" id="quizopen" type="button">연습문제 풀기 (7문제)</button><div id="quizbox"></div>'
      : '')+
    (d.practice
      ? '<a class="practicebtn" href="'+esc(d.practice)+'" target="_blank" rel="noopener">블로그에서 더 풀기 ↗</a>'
      : '')+
    '<button class="readbtn" id="readbtn" type="button"></button>'+
    '<a class="askbtn" id="askbtn" href="#">이 과에 대해 질문 보내기</a>'+
    '<nav class="pager">'+pager+'</nav>'+
    '<a class="tolist" href="index.html">전체 목록 보기</a>';

  var MAIL=['jongeek1','gmail.com'].join('@');
  document.getElementById('askbtn').href='mailto:'+MAIL
    +'?subject='+encodeURIComponent('[못난이삼돌이 영문법] '+d.title+' 질문')
    +'&body='+encodeURIComponent('\n\n---\n'+d.title+'\n'+location.href);

  // ── 연습문제 ──
  var qopen=document.getElementById('quizopen');
  if(qopen){
    var LABEL={scene:'장면에서',choice:'고르기',fill:'채우기',order:'조립하기',analyze:'분석하기'};
    var Q=quizData[d.id], solved={}, opened=false;

    function norm(s){return String(s).toLowerCase().replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim();}

    function verdict(el,ok,q,showAnswer){
      var v=el.querySelector('.verdict')||document.createElement('div');
      v.className='verdict '+(ok?'right':'wrong');
      v.innerHTML=(showAnswer ? '<b>'+esc(q.a)+'</b>'+(q.why?' — ':'')
                              : ok ? '맞았어. ' : '<b>정답 '+esc(q.a)+'</b>. ')
                 +(q.why?esc(q.why):'');
      if(!el.querySelector('.verdict')) el.appendChild(v);
    }

    function score(){
      var n=Object.keys(solved).length, r=0;
      for(var k in solved) if(solved[k]) r++;
      var s=document.getElementById('qscore');
      if(s) s.innerHTML='<span>푼 문제 '+n+' / 7</span><span><b>'+r+'</b> 맞음</span>';
    }

    function build(){
      var html='<div class="quiz"><div class="qcore"><b>핵심</b>'+esc(Q.core)+'</div>';
      Q.qs.forEach(function(q,i){
        html+='<div class="qitem" data-i="'+i+'">'+
          '<div class="qnum"><b>'+(i+1)+'</b><span>'+LABEL[q.t]+'</span></div>'+
          (q.ctx?'<p class="qctx">'+esc(q.ctx)+'</p>':'')+
          (q.lead?'<p class="qctx">'+esc(q.lead)+'</p>':'')+
          '<p class="qq">'+esc(q.q)+'</p>'+
          (q.hint?'<p class="qhint">힌트 · '+esc(q.hint)+'</p>':'');
        if(q.t==='scene'||q.t==='choice'){
          html+='<div class="opts">'+q.opts.map(function(o){
            return '<button class="opt" type="button" data-v="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+'</div>';
        } else if(q.t==='fill'){
          html+='<div class="fillrow"><input type="text" placeholder="답을 쓰세요"><button type="button">확인</button></div>';
        } else if(q.t==='order'){
          html+='<div class="chips">'+q.words.map(function(w){
            return '<button class="chip" type="button">'+esc(w)+'</button>';}).join('')+'</div>'+
            '<div class="tray"></div><button class="showa" type="button">확인</button>';
        } else {
          html+='<button class="showa" type="button">정답 보기</button>';
        }
        html+='</div>';
      });
      html+='<div class="qscore" id="qscore"><span>푼 문제 0 / 7</span><span><b>0</b> 맞음</span></div></div>';
      document.getElementById('quizbox').innerHTML=html;

      document.getElementById('quizbox').addEventListener('click',function(e){
        var item=e.target.closest('.qitem'); if(!item) return;
        var i=+item.getAttribute('data-i'), q=Q.qs[i];

        var o=e.target.closest('.opt');
        if(o){
          if(item.querySelector('.opt.ok')) return;
          var ok=norm(o.getAttribute('data-v'))===norm(q.a);
          [].forEach.call(item.querySelectorAll('.opt'),function(b){
            if(norm(b.getAttribute('data-v'))===norm(q.a)) b.classList.add('ok');
            else if(b===o) b.classList.add('no');
          });
          solved[i]=ok; verdict(item,ok,q); score(); return;
        }
        var chip=e.target.closest('.chip');
        if(chip){ var tray=item.querySelector('.tray');
          tray.textContent=(tray.textContent?tray.textContent+' ':'')+chip.textContent;
          chip.classList.add('used'); return; }
        var tray2=e.target.closest('.tray');
        if(tray2){ tray2.textContent='';
          [].forEach.call(item.querySelectorAll('.chip'),function(c){c.classList.remove('used')}); return; }
        var b=e.target.closest('button');
        if(!b) return;
        if(q.t==='fill'){
          var v=item.querySelector('input').value;
          if(!v.trim()) return;
          var ok2=norm(v)===norm(q.a);
          solved[i]=ok2; verdict(item,ok2,q); score();
        } else if(q.t==='order'){
          var t=item.querySelector('.tray').textContent;
          if(!t.trim()) return;
          var ok3=norm(t)===norm(q.a);
          solved[i]=ok3; verdict(item,ok3,q); score();
        } else if(q.t==='analyze'){
          if(solved[i]===undefined) solved[i]=true;
          verdict(item,true,q,true); b.style.display='none'; score();
        }
      });
    }

    qopen.addEventListener('click',function(){
      if(!opened){ build(); opened=true; qopen.textContent='연습문제 접기';
        var bx=document.getElementById('quizbox');
        if(bx.scrollIntoView) bx.scrollIntoView({behavior:'smooth',block:'start'}); }
      else { var box=document.getElementById('quizbox');
        var hide=box.style.display!=='none';
        box.style.display=hide?'none':'block';
        qopen.textContent=hide?'연습문제 풀기 (7문제)':'연습문제 접기'; }
    });
  }

  var done=load();
  var btn=document.getElementById('readbtn');
  function paintBtn(){
    var on=!!done[d.id];
    btn.classList.toggle('on',on);
    btn.setAttribute('aria-pressed',on?'true':'false');
    btn.textContent=on?'✓ 읽었어':'다 읽었으면 눌러줘';
  }
  btn.addEventListener('click',function(){
    if(done[d.id]) delete done[d.id]; else done[d.id]=true;
    save(done); paintBtn();
  });
  paintBtn();

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'&&prev) location.href='card.html?id='+prev.id;
    if(e.key==='ArrowRight'&&next) location.href='card.html?id='+next.id;
  });
})();
</script>
</body>
</html>
