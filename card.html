<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>못난이삼돌이 영문법 - 카드뷰어</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { background-color: #121212; color: #E4E4E7; word-break: keep-all; }</style>
</head>
<body class="min-h-screen flex flex-col p-4">

  <header class="max-w-md w-full mx-auto flex justify-between items-center py-2 border-b border-zinc-800">
    <a href="index.html" class="text-xs text-zinc-400 hover:text-zinc-200 transition-colors">← 홈으로</a>
    <span id="lesson-month" class="text-xs text-zinc-500"></span>
  </header>

  <main class="max-w-md w-full mx-auto bg-zinc-900 border border-zinc-800 rounded-2xl p-6 my-8 space-y-6 shadow-2xl">
    <div>
      <h1 id="lesson-title" class="text-xl font-bold text-white mb-2"></h1>
      <div id="lesson-tags" class="flex gap-2 flex-wrap"></div>
    </div>

    <div id="lesson-content" class="space-y-3 text-zinc-300 text-base leading-relaxed"></div>

    <div id="lesson-progress" class="space-y-1">
      <div class="h-1 w-full bg-zinc-800 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-white rounded-full transition-all"></div>
      </div>
      <p id="progress-text" class="text-xs text-zinc-600 text-right"></p>
    </div>

    <div id="lesson-nav" class="flex gap-4 pt-4 border-t border-zinc-800">
      <button id="btn-prev" class="flex-1 py-3 bg-zinc-800 text-white font-bold rounded-xl disabled:opacity-30 disabled:cursor-not-allowed">👈 이전 과</button>
      <button id="btn-next" class="flex-1 py-3 bg-white text-black font-bold rounded-xl disabled:opacity-30 disabled:cursor-not-allowed">다음 과 👉</button>
    </div>
  </main>

  <footer class="text-center text-xs text-zinc-600 mt-auto pt-4">못난이삼돌이 영문법</footer>

  <script src="data.js"></script>
  <script>
    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    const urlParams = new URLSearchParams(window.location.search);
    const currentId = parseInt(urlParams.get('id'), 10) || 1;

    const $ = id => document.getElementById(id);

    function renderNotFound() {
      $('lesson-month').textContent = '';
      $('lesson-title').textContent = '그런 과는 없습니다';
      $('lesson-tags').innerHTML = '';
      $('lesson-content').innerHTML = `<p>01과부터 ${grammarData.length}과까지 있습니다.</p>`;
      $('lesson-progress').classList.add('hidden');
      $('lesson-nav').innerHTML = `<a href="index.html" class="flex-1 py-3 bg-white text-black font-bold rounded-xl text-center">목록으로 →</a>`;
    }

    function renderCard(id) {
      const idx = grammarData.findIndex(item => item.id === id);
      if (idx === -1) { renderNotFound(); return null; }

      const data = grammarData[idx];
      document.title = data.title + ' · 못난이삼돌이 영문법';

      $('lesson-month').textContent = `MONTH ${data.month}`;
      $('lesson-title').textContent = data.title;

      $('lesson-tags').innerHTML = data.tags
        .map(t => `<span class="text-xs bg-zinc-800 text-zinc-400 px-2 py-1 rounded">#${esc(t)}</span>`)
        .join('');

      $('lesson-content').innerHTML = data.content
        .map(line => line.startsWith('## ')
          ? `<p class="text-white font-bold text-sm pt-4 pb-1 border-b border-zinc-800">${esc(line.slice(3))}</p>`
          : `<p>${esc(line)}</p>`)
        .join('');

      $('progress-bar').style.width = Math.round((idx + 1) / grammarData.length * 100) + '%';
      $('progress-text').textContent = `${idx + 1} / ${grammarData.length}`;

      const prev = grammarData[idx - 1];
      const next = grammarData[idx + 1];

      $('btn-prev').disabled = !prev;
      $('btn-next').disabled = !next;
      if (prev) $('btn-prev').onclick = () => location.href = `card.html?id=${prev.id}`;
      if (next) $('btn-next').onclick = () => location.href = `card.html?id=${next.id}`;

      return { prev, next };
    }

    const nav = renderCard(currentId);

    document.addEventListener('keydown', e => {
      if (!nav) return;
      if (e.key === 'ArrowLeft' && nav.prev) location.href = `card.html?id=${nav.prev.id}`;
      if (e.key === 'ArrowRight' && nav.next) location.href = `card.html?id=${nav.next.id}`;
    });
  </script>
</body>
</html>
